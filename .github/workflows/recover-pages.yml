name: Recover interrupted Pages deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-pages.yml']
permissions:
  pages: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel interrupted deployment and read status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          deployment_url="https://api.github.com/repos/$GH_REPO/pages/deployments/3d82cecc7a63d362a3805998b573740061a94219"
          curl --fail-with-body --silent --show-error --request POST --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" "$deployment_url/cancel"
          curl --fail-with-body --silent --show-error --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" "$deployment_url/status"
