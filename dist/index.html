<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="중학교 과학 교과서의 탐구활동과 준비물을 찾아보고 수업 준비 목록을 만드세요.">
  <meta name="theme-color" content="#174a75">
  <title>중학교 과학 수업 준비</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#results">활동 목록으로 건너뛰기</a>
  <header class="topbar">
    <div><h1>중학교 과학 수업 준비</h1><p>교과서 탐구활동 · 준비물</p></div>
    <button id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel">학급 설정</button>
  </header>
  <section id="settings-panel" class="settings-panel" aria-label="학급 설정" hidden>
    <div class="settings-heading"><h2>학급 설정</h2><span id="save-status" role="status"></span></div>
    <div class="settings-fields">
      <label>학급 수<input id="class-count" type="number" min="1" max="100" step="1" placeholder="입력" inputmode="numeric"></label>
      <label>학급당 학생 수<input id="students-per-class" type="number" min="1" max="100" step="1" placeholder="입력" inputmode="numeric"></label>
      <label>조당 학생 수<input id="students-per-group" type="number" min="1" max="100" step="1" placeholder="입력" inputmode="numeric"></label>
      <p id="class-summary">학급 정보를 입력하세요.</p>
    </div>
    <p class="help">출판사 선택과 학급 설정은 이 브라우저에 자동 저장됩니다. 브라우저의 사이트 데이터를 삭제하면 초기화됩니다.</p>
  </section>
  <div id="storage-warning" class="notice" role="status" hidden></div>
  <main class="workspace">
    <aside class="filters" aria-label="활동 필터">
      <div class="section-title"><h2>활동 찾기</h2><button id="reset-filters" type="button" class="text-button">필터 초기화</button></div>
      <label for="search">검색</label>
      <input id="search" type="search" placeholder="활동명, 준비물, 약품명" autocomplete="off">
      <label for="grade-filter">학년</label><select id="grade-filter"><option value="all">전체 학년</option><option value="unknown">미확인</option></select>
      <label for="unit-filter">단원</label><select id="unit-filter"><option value="all">전체 단원</option></select>
      <label for="achievement-filter">성취기준</label><select id="achievement-filter"><option value="all">전체 성취기준</option></select>
      <fieldset id="publisher-filters"><legend>출판사·저자</legend><div id="publisher-options"></div></fieldset>
    </aside>
    <section class="content" aria-label="탐구활동과 준비 목록">
      <nav class="view-tabs" aria-label="보기 선택"><button type="button" id="activities-tab" aria-pressed="true">탐구활동</button><button type="button" id="materials-tab" aria-pressed="false">준비 목록 <span id="selection-count">0</span></button></nav>
      <div id="load-status" role="status" class="loading">활동을 불러오는 중입니다.</div>
      <section id="activities-view">
        <div class="results-toolbar"><h2 id="result-count" aria-live="polite">탐구활동</h2><div><button id="select-results" type="button" disabled>검색 결과 담기</button><label class="inline-label" for="sort-order">정렬<select id="sort-order"><option value="source">원자료 순서</option><option value="publisher">출판사순</option><option value="title">활동명순</option></select></label></div></div>
        <div id="active-achievement" class="achievement-context" hidden></div>
        <div id="results" tabindex="-1"></div>
        <button type="button" id="load-more" class="load-more" hidden>활동 더 보기</button>
      </section>
      <section id="materials-view" hidden>
        <div class="results-toolbar"><h2>선택한 활동의 준비 목록</h2><div><button id="export-list" type="button" disabled>CSV 다운로드</button><button id="clear-selection" type="button" disabled>선택 비우기</button></div></div>
        <div id="selected-activities"></div>
        <p id="materials-summary" class="help"></p>
        <div id="aggregate-materials"></div>
      </section>
    </section>
  </main>
  <dialog id="activity-dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="close-dialog" type="button">닫기</button></div><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" class="toast" hidden></div>
</body>
</html>
