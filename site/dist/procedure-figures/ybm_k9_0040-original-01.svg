<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 658" role="img" aria-labelledby="title desc"><title id="title">북적도 해류가 강한 경우</title><desc id="desc">열 수송 방향: 적도 부근에서 동쪽의 따뜻한 물을 서쪽으로 운반 동태평양: 평상시보다 낮은 수온 주변 지역 사례: 호주: 집중호우·홍수 / 북아메리카: 한파 / 북태평양 적도 해역: 강한 태풍 / 아르헨티나: 가뭄·화재</desc><rect width="600" height="658" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">북적도 해류가 강한 경우</text><rect x="25" y="75" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="108" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">열 수송 방향</text><text x="44" y="140" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">적도 부근에서 동쪽의 따뜻한 물을 서쪽으로</text><text x="44" y="173" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">운반</text><rect x="25" y="235" width="550" height="113" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="268" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">동태평양</text><text x="44" y="300" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">평상시보다 낮은 수온</text><rect x="25" y="362" width="550" height="179" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="395" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">주변 지역 사례</text><text x="44" y="427" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">호주: 집중호우·홍수 / 북아메리카: 한파</text><text x="44" y="460" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">/ 북태평양 적도 해역: 강한 태풍 /</text><text x="44" y="493" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">아르헨티나: 가뭄·화재</text><text x="30" y="575" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">원자료의 현상만 독립 항목으로 정리. 모든 사례를 항상</text><text x="30" y="603" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">일어나는 결과로 일반화하지 않는다.</text></g></svg>
