<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 884" role="img" aria-labelledby="title desc"><title id="title">계절별 기압 배치 읽기</title><desc id="desc">봄 자료의 특징: 우리나라 남쪽 바다에 전선을 동반한 저기압. 그 서쪽과 동쪽에 고기압. 여름 자료의 특징: 우리나라 남동쪽 해상에 고기압. 북쪽과 서쪽에는 저기압. 등압선은 겨울보다 넓은 간격. 가을 자료의 특징: 한반도 부근에 고기압. 그 서쪽과 북동쪽에 저기압. 겨울 자료의 특징: 북서쪽 대륙에 강한 고기압, 동쪽 일본 부근에 저기압. 우리나라 주변 등압선 간격이 좁음.</desc><rect width="600" height="884" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">계절별 기압 배치 읽기</text><rect x="25" y="75" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="108" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">봄 자료의 특징</text><text x="44" y="140" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">우리나라 남쪽 바다에 전선을 동반한 저기압.</text><text x="44" y="173" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">그 서쪽과 동쪽에 고기압.</text><rect x="25" y="235" width="550" height="179" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="268" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">여름 자료의 특징</text><text x="44" y="300" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">우리나라 남동쪽 해상에 고기압. 북쪽과</text><text x="44" y="333" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">서쪽에는 저기압. 등압선은 겨울보다 넓은</text><text x="44" y="366" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">간격.</text><rect x="25" y="428" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="461" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">가을 자료의 특징</text><text x="44" y="493" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">한반도 부근에 고기압. 그 서쪽과 북동쪽에</text><text x="44" y="526" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">저기압.</text><rect x="25" y="588" width="550" height="179" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="621" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">겨울 자료의 특징</text><text x="44" y="653" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">북서쪽 대륙에 강한 고기압, 동쪽 일본</text><text x="44" y="686" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">부근에 저기압. 우리나라 주변 등압선 간격이</text><text x="44" y="719" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">좁음.</text><text x="30" y="801" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">기압 배치의 위치 관계표. 풍향·바람 세기·구름·강수를</text><text x="30" y="829" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">추론한다.</text></g></svg>
