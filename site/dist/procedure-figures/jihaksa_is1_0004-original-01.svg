<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 578" role="img"><title>모호한 양을 분명하게 말하기</title><desc>단위를 배우기 위한 대화 소재</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="578" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">모호한 양을 분명하게 말하기</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">시간 표현</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">조금 뒤에 만나자.</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">거리 표현</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">여기서 멀지 않은 곳이야.</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">질량 표현</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">혼자 들기는 무거운 상자야.</text><rect x="22" y="404" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="404" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="439" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">과제</text><text x="42" y="477" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">각 표현을 측정값과 단위가 드러나게 바꾸기</text><text x="24" y="531" font-size="21" fill="#56717d">단위를 배우기 위한 대화 소재</text></g></svg>
