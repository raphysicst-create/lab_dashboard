<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" role="img" aria-labelledby="title desc"><title id="title">세포에서 찾아볼 구조</title><desc id="desc">공통 구조는 핵·세포막·미토콘드리아이며 식물 세포에는 세포벽과 엽록체도 표시한 독립 개념도. 실제 크기·개수 비율은 아니다.</desc><rect width="600" height="550" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">세포에서 찾아볼 구조</text><text x="30" y="93" font-size="25" fill="#21394a" text-anchor="start" font-weight="bold">동물 세포</text><text x="330" y="93" font-size="25" fill="#21394a" text-anchor="start" font-weight="bold">식물 세포</text><ellipse cx="150" cy="210" rx="116" ry="92" fill="#eff4fa" stroke="#4582ab" stroke-width="4"/><rect x="320" y="115" width="245" height="192" rx="24" fill="#f1f8ed" stroke="#629457"/><rect x="331" y="126" width="223" height="170" rx="19" fill="none" stroke="#4582ab"/><circle cx="143" cy="203" r="33" fill="#e3cbed" stroke="#86569b" stroke-width="3"/><circle cx="433" cy="210" r="33" fill="#e3cbed" stroke="#86569b" stroke-width="3"/><ellipse cx="83" cy="190" rx="19" ry="10" fill="#efb584"/><ellipse cx="213" cy="245" rx="19" ry="10" fill="#efb584"/><ellipse cx="380" cy="165" rx="19" ry="10" fill="#efb584"/><ellipse cx="500" cy="258" rx="19" ry="10" fill="#efb584"/><ellipse cx="363" cy="250" rx="17" ry="10" fill="#81b66b"/><ellipse cx="510" cy="165" rx="17" ry="10" fill="#81b66b"/><ellipse cx="469" cy="145" rx="17" ry="10" fill="#81b66b"/><circle cx="45" cy="343" r="10" fill="#e3cbed" stroke="none" stroke-width="3"/><text x="70" y="350" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">핵</text><circle cx="45" cy="386" r="10" fill="#efb584" stroke="none" stroke-width="3"/><text x="70" y="393" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">미토콘드리아</text><circle cx="45" cy="429" r="10" fill="#81b66b" stroke="none" stroke-width="3"/><text x="70" y="436" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">엽록체</text><text x="28" y="485" font-size="20" fill="#21394a" text-anchor="start" font-weight="normal">파란 경계: 세포막 / 식물의 바깥 경계: 세포벽</text><text x="28" y="523" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">비율과 개수는 실제 세포와 다른 구조 모형</text></g></svg>
