<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 682" role="img"><title>에너지 이동 경로별 장부</title><desc>방향별 수치를 합산하여 각 영역의 유입·유출 비교</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="682" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">에너지 이동 경로별 장부</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">기준</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">지구로 들어오는 태양 복사 = 100</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">태양 → 우주 반사</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">지표 5 + 대기·구름 25 = 30</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">태양 → 흡수</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">대기 20 · 지표 50</text><rect x="22" y="404" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="404" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="439" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">지표 → 방출</text><text x="42" y="477" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">대기 132 · 우주 12</text><rect x="22" y="508" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="508" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="543" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">대기 → 방출</text><text x="42" y="581" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">지표 94 · 우주 58</text><text x="24" y="635" font-size="21" fill="#56717d">방향별 수치를 합산하여 각 영역의 유입·유출 비교</text></g></svg>
