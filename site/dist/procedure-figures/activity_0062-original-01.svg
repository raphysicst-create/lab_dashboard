<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 431" role="img"><title>계절별 은하수 사진 비교 기록</title><style>text{font-family:Arial,"Malgun Gothic",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style><rect width="640" height="431" fill="white"/><text x="26" y="40" font-size="27" fill="#24364b" text-anchor="start" font-weight="bold">계절별 은하수 사진 비교 기록</text><line x1="26" y1="56" x2="614" y2="56" stroke="#dce5ee" stroke-width="2"/><rect x="26" y="75" width="150" height="54" rx="0" fill="#e6f0f8" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="110" font-size="23" fill="#24364b" text-anchor="start" font-weight="bold">확인할 것</text><rect x="176" y="75" width="438" height="54" rx="0" fill="#e6f0f8" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="110" font-size="23" fill="#24364b" text-anchor="start" font-weight="bold">각 사진에 적을 내용</text><rect x="26" y="129" width="150" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="159" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">촬영 조건</text><rect x="176" y="129" width="438" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="159" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">우리나라 촬영 여부와 날짜·계절을</text><text x="188" y="190" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">확인한다.</text><rect x="26" y="213" width="150" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="243" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">여름 자료</text><rect x="176" y="213" width="438" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="243" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">은하수 띠의 밝기·폭·보이는</text><text x="188" y="274" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">방향을 기록한다.</text><rect x="26" y="297" width="150" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="327" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">겨울 자료</text><rect x="176" y="297" width="438" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="327" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">같은 항목을 기록하고 여름 자료와</text><text x="188" y="358" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">대조한다.</text><text x="26" y="415" font-size="14" fill="#64748b" text-anchor="start" font-weight="normal">실제 사진은 출처와 촬영 계절을 확인하여 직접 조사</text></svg>