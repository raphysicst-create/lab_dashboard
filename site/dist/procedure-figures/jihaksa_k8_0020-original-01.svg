<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 630" role="img" aria-labelledby="title desc"><title id="title">암석에서 토양까지</title><desc id="desc">관찰 대상 1 · 산 사면: 크기가 서로 다른 암석 조각들이 모여 있다. 조각이 생기는 과정을 생각한다. 관찰 대상 2 · 제주 밭: 흑갈색 토양이 분포한다. 주변 암석과의 관계를 생각한다. 설명에 포함할 변화: 암석의 풍화, 조각의 생성, 토양의 형성을 세 장면으로 연결한다.</desc><rect width="600" height="630" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">암석에서 토양까지</text><rect x="25" y="75" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="108" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">관찰 대상 1 · 산 사면</text><text x="44" y="140" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">크기가 서로 다른 암석 조각들이 모여 있다.</text><text x="44" y="173" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">조각이 생기는 과정을 생각한다.</text><rect x="25" y="235" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="268" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">관찰 대상 2 · 제주 밭</text><text x="44" y="300" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">흑갈색 토양이 분포한다. 주변 암석과의</text><text x="44" y="333" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">관계를 생각한다.</text><rect x="25" y="395" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="428" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">설명에 포함할 변화</text><text x="44" y="460" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">암석의 풍화, 조각의 생성, 토양의 형성을</text><text x="44" y="493" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">세 장면으로 연결한다.</text><text x="30" y="575" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">실제 사진을 재현하지 않은 관찰 특징 정리</text></g></svg>
