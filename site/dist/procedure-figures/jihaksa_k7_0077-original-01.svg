<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" role="img" aria-labelledby="title desc"><title id="title">계절에 따른 관찰 자리</title><desc id="desc">중앙 전등 주위 네 방향에 별자리 표지를 두고 관찰자는 그 안쪽 원을 따라 90도씩 이동한다. 별자리 그림 자체는 제공하지 않는다.</desc><rect width="600" height="610" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">계절에 따른 관찰 자리</text><circle cx="300" cy="285" r="43" fill="#ffe5a4" stroke="none" stroke-width="3"/><text x="300" y="294" font-size="22" fill="#21394a" text-anchor="middle" font-weight="normal">전등</text><circle cx="300" cy="285" r="125" fill="none" stroke="#b8cbd3" stroke-dasharray="9 7" stroke-width="3"/><text x="300" y="112" font-size="22" fill="#21394a" text-anchor="middle" font-weight="normal">물고기자리</text><text x="490" y="291" font-size="22" fill="#21394a" text-anchor="middle" font-weight="normal">쌍둥이자리</text><text x="300" y="491" font-size="22" fill="#21394a" text-anchor="middle" font-weight="normal">처녀자리</text><text x="102" y="291" font-size="22" fill="#21394a" text-anchor="middle" font-weight="normal">궁수자리</text><circle cx="300" cy="160" r="13" fill="#258d98" stroke="none" stroke-width="3"/><line x1="300" y1="160" x2="300" y2="234" stroke="#1c7a88" stroke-width="3"/><polygon points="300.0,234.0 295.2,224.1 304.8,224.1" fill="#1c7a88"/><line x1="300" y1="160" x2="300" y2="122" stroke="#1c7a88" stroke-width="3"/><polygon points="300.0,122.0 304.8,131.9 295.2,131.9" fill="#1c7a88"/><text x="300" y="544" font-size="22" fill="#21394a" text-anchor="middle" font-weight="normal">네 자리는 90° 간격 · 눈높이 동일</text><text x="300" y="581" font-size="22" fill="#21394a" text-anchor="middle" font-weight="normal">관찰자는 안쪽 원을 따라 이동</text></g></svg>
