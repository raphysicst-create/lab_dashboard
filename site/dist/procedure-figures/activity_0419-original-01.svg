<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 565" role="img"><title>종이 헬리콥터의 구성 요소</title><style>text{font-family:Arial,"Malgun Gothic",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style><rect width="640" height="565" fill="white"/><text x="26" y="40" font-size="27" fill="#24364b" text-anchor="start" font-weight="bold">종이 헬리콥터의 구성 요소</text><line x1="26" y1="56" x2="614" y2="56" stroke="#dce5ee" stroke-width="2"/><path d="M 320 220 L 80 170 L 80 112 L 320 160 L 560 112 L 560 170 Z" fill="#dcefe9" stroke="#11756c" stroke-width="3"/><rect x="290" y="220" width="60" height="200" rx="2" fill="#dcefe9" stroke="#11756c" stroke-width="2"/><rect x="306" y="392" width="28" height="76" rx="11" fill="none" stroke="#24364b" stroke-width="2"/><text x="81" y="90" font-size="23" fill="#24364b" text-anchor="start" font-weight="normal">왼쪽 날개</text><text x="438" y="90" font-size="23" fill="#24364b" text-anchor="start" font-weight="normal">오른쪽 날개</text><text x="382" y="318" font-size="23" fill="#24364b" text-anchor="start" font-weight="normal">꼬리</text><text x="382" y="441" font-size="23" fill="#24364b" text-anchor="start" font-weight="normal">클립</text><text x="320" y="517" font-size="22" fill="#24364b" text-anchor="middle" font-weight="normal">두 날개는 반대 방향으로 접어 펼친다.</text><text x="26" y="549" font-size="14" fill="#64748b" text-anchor="start" font-weight="normal">학습용 도식 · 크기와 거리는 실제 비율이 아님</text></svg>