="22" y="400" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="400" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="435" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">축에 연결된 코일</text><text x="42" y="473" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">도선이 감긴 회전 부분</text><rect x="22" y="504" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="504" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="539" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">겉통 안쪽의 자석</text><text x="42" y="577" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">회전 부분 둘레에 배치</text><rect x="22" y="608" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="608" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="643" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">발전 시험</text><text x="42" y="681" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">양쪽 단자를 LED와 연결하고 축 회전</text><text x="24" y="735" font-size="21" fill="#56717d">부품 관계를 나타낸 절개 개념도</text></g></svg>
