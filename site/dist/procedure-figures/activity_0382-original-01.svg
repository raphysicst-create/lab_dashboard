<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img"><title>별자리 이름 카드</title><style>text{font-family:Arial,"Malgun Gothic",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style><rect width="640" height="720" fill="white"/><text x="26" y="40" font-size="27" fill="#24364b" text-anchor="start" font-weight="bold">별자리 이름 카드</text><line x1="26" y1="56" x2="614" y2="56" stroke="#dce5ee" stroke-width="2"/><rect x="30" y="84" width="280" height="64" rx="10" fill="#edf4f9" stroke="#b7c7d8" stroke-width="2"/><text x="170" y="124" font-size="25" fill="#24364b" text-anchor="middle" font-weight="normal">처녀자리</text><rect x="330" y="84" width="280" height="64" rx="10" fill="#edf4f9" stroke="#b7c7d8" stroke-width="2"/><text x="470" y="124" font-size="25" fill="#24364b" text-anchor="middle" font-weight="normal">사자자리</text><rect x="30" y="163" width="280" height="64" rx="10" fill="#edf4f9" stroke="#b7c7d8" stroke-width="2"/><text x="170" y="203" font-size="25" fill="#24364b" text-anchor="middle" font-weight="normal">게자리</text><rect x="330" y="163" width="280" height="64" rx="10" fill="#edf4f9" stroke="#b7c7d8" stroke-width="2"/><text x="470" y="203" font-size="25" fill="#24364b" text-anchor="middle" font-weight="normal">쌍둥이자리</text><rect x="30" y="242" width="280" height="64" rx="10" fill="#edf4f9" stroke="#b7c7d8" stroke-width="2"/><text x="170" y="282" font-size="25" fill="#24364b" text-anchor="middle" font-weight="normal">황소자리</text><rect x="330" y="242" width="280" height="64" rx="10" fill="#edf4f9" stroke="#b7c7d8" stroke-width="2"/><text x="470" y="282" font-size="25" fill="#24364b" text-anchor="middle" font-weight="normal">양자리</text><rect x="30" y="321" width="280" height="64" rx="10" fill="#edf4f9" stroke="#b7c7d8" stroke-width="2"/><text x="170" y="361" font-size="25" fill="#24364b" text-anchor="middle" font-weight="normal">물고기자리</text><rect x="330" y="321" width="280" height="64" rx="10" fill="#edf4f9" stroke="#b7c7d8" stroke-width="2"/><text x="470" y="361" font-size="25" fill="#24364b" text-anchor="middle" font-weight="normal">물병자리</text><rect x="30" y="400" width="280" height="64" rx="10" fill="#edf4f9" stroke="#b7c7d8" stroke-width="2"/><text x="170" y="440" font-size="25" fill="#24364b" text-anchor="middle" font-weight="normal">염소자리</text><rect x="330" y="400" width="280" height="64" rx="10" fill="#edf4f9" stroke="#b7c7d8" stroke-width="2"/><text x="470" y="440" font-size="25" fill="#24364b" text-anchor="middle" font-weight="normal">궁수자리</text><rect x="30" y="479" width="280" height="64" rx="10" fill="#edf4f9" stroke="#b7c7d8" stroke-width="2"/><text x="170" y="519" font-size="25" fill="#24364b" text-anchor="middle" font-weight="normal">전갈자리</text><rect x="330" y="479" width="280" height="64" rx="10" fill="#edf4f9" stroke="#b7c7d8" stroke-width="2"/><text x="470" y="519" font-size="25" fill="#24364b" text-anchor="middle" font-weight="normal">천칭자리</text><text x="30" y="606" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">이름 카드를 오려 바탕 판의 같은 이름 자리에 세운다.</text><text x="30" y="638" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">글씨는 관측자가 있는 안쪽으로 향하게 한다.</text><text x="26" y="704" font-size="14" fill="#64748b" text-anchor="start" font-weight="normal">카드의 배치 순서는 바탕 판에 따름</text></svg>