<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 670" role="img" aria-labelledby="title desc"><title id="title">물 분해 기체 수집 장치</title><desc id="desc">수용액 속에 거꾸로 세운 두 빨대 아래의 침핀을 전지의 서로 다른 극에 연결한다. 빨대의 마개는 위에 있고 두 핀은 서로 닿지 않는다. 용기 실제 형태를 재현하지 않은 연결도.</desc><rect width="600" height="670" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">물 분해 기체 수집 장치</text><rect x="85" y="245" width="430" height="210" rx="8" fill="#e4f1f5" stroke="#678b9b"/><text x="300" y="423" font-size="23" fill="#21394a" text-anchor="middle" font-weight="normal">황산 나트륨 수용액</text><rect x="177" y="120" width="56" height="220" rx="4" fill="#d8eef2" stroke="#52778b"/><rect x="173" y="112" width="64" height="15" rx="2" fill="#596c79" stroke="none"/><line x1="205" y1="310" x2="205" y2="365" stroke="#8e755e" stroke-width="5"/><rect x="367" y="120" width="56" height="220" rx="4" fill="#d8eef2" stroke="#52778b"/><rect x="363" y="112" width="64" height="15" rx="2" fill="#596c79" stroke="none"/><line x1="395" y1="310" x2="395" y2="365" stroke="#8e755e" stroke-width="5"/><line x1="205" y1="365" x2="205" y2="540" stroke="#416b7d" stroke-width="3"/><line x1="395" y1="365" x2="395" y2="540" stroke="#416b7d" stroke-width="3"/><rect x="203" y="515" width="194" height="75" rx="6" fill="#faf0d6" stroke="#a88a55"/><text x="300" y="561" font-size="25" fill="#21394a" text-anchor="middle" font-weight="normal">9 V 전지</text><text x="221" y="542" font-size="20" fill="#21394a" text-anchor="start" font-weight="normal">+</text><text x="366" y="542" font-size="20" fill="#21394a" text-anchor="start" font-weight="normal">−</text><text x="300" y="84" font-size="23" fill="#21394a" text-anchor="middle" font-weight="normal">마개가 위 · 용액으로 채운 빨대</text><text x="300" y="480" font-size="22" fill="#21394a" text-anchor="middle" font-weight="normal">침핀끼리 닿지 않도록 분리</text><text x="300" y="636" font-size="22" fill="#21394a" text-anchor="middle" font-weight="normal">기체는 두 빨대에 따로 모인다.</text></g></svg>
