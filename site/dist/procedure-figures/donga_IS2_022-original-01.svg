<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 579" role="img"><title>1880~2021년 장기 관측 요약</title><desc>관측 추세·범위의 요약 · 연도별 곡선 아님</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="579" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">1880~2021년 장기 관측 요약</text><rect x="22" y="92" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">1800년대 후반</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">이산화 탄소 약 290 ppm / 기온 편차는 주로</text><text x="42" y="200" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">음수</text><rect x="22" y="231" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="231" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="266" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">최근</text><text x="42" y="304" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">2021년 410 ppm 초과 / 기온 편차는 주로</text><text x="42" y="339" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">양수</text><rect x="22" y="370" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="370" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="405" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">변화의 속도</text><text x="42" y="443" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">농도는 초기의 완만한 증가에서 최근의</text><text x="42" y="478" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">가파른 증가로 변화</text><text x="24" y="532" font-size="21" fill="#56717d">관측 추세·범위의 요약 · 연도별 곡선 아님</text></g></svg>
