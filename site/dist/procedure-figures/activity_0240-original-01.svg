<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" role="img"><title>같은 바깥 크기에서 테두리 길이 비교</title><style>text{font-family:Arial,"Malgun Gothic",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style><rect width="640" height="580" fill="white"/><text x="26" y="40" font-size="27" fill="#24364b" text-anchor="start" font-weight="bold">같은 바깥 크기에서 테두리 길이 비교</text><line x1="26" y1="56" x2="614" y2="56" stroke="#dce5ee" stroke-width="2"/><circle cx="320" cy="270" r="177" fill="none" stroke="#d6dfe8" stroke-width="2"/><circle cx="320" cy="175" r="82" fill="none" stroke="#2563a6" stroke-width="2"/><circle cx="238" cy="317" r="82" fill="none" stroke="#2563a6" stroke-width="2"/><circle cx="402" cy="317" r="82" fill="none" stroke="#2563a6" stroke-width="2"/><text x="320" y="80" font-size="23" fill="#24364b" text-anchor="middle" font-weight="normal">세 작은 원이 서로 닿게 배치</text><text x="320" y="493" font-size="23" fill="#24364b" text-anchor="middle" font-weight="normal">바깥 원과 중심 틈 쪽의 호를 지운다.</text><path d="M 279 246 A 82 82 0 0 0 361 246 M 279 246 A 82 82 0 0 1 320 317 M 361 246 A 82 82 0 0 0 320 317" fill="none" stroke="#b84d22" stroke-width="5" stroke-dasharray="6 5"/><circle cx="320" cy="270" r="177" fill="none" stroke="#b84d22" stroke-width="3" stroke-dasharray="6 6"/><text x="320" y="529" font-size="20" fill="#24364b" text-anchor="middle" font-weight="normal">주황 점선: 지울 선 / 파랑: 남길 테두리</text><text x="26" y="564" font-size="14" fill="#64748b" text-anchor="start" font-weight="normal">학습용 도식 · 크기와 거리는 실제 비율이 아님</text></svg>