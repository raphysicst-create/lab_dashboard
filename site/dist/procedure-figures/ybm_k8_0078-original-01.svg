<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 658" role="img" aria-labelledby="title desc"><title id="title">오리온자리 세 별의 비교</title><desc id="desc">베텔게우스: 색과 표면 온도를 확인한 자료를 찾아 기록한다. 민타카: 색과 표면 온도를 확인한 자료를 찾아 기록한다. 리겔: 색과 표면 온도를 확인한 자료를 찾아 기록한다.</desc><rect width="600" height="658" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">오리온자리 세 별의 비교</text><rect x="25" y="75" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="108" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">베텔게우스</text><text x="44" y="140" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">색과 표면 온도를 확인한 자료를 찾아</text><text x="44" y="173" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">기록한다.</text><rect x="25" y="235" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="268" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">민타카</text><text x="44" y="300" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">색과 표면 온도를 확인한 자료를 찾아</text><text x="44" y="333" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">기록한다.</text><rect x="25" y="395" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="428" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">리겔</text><text x="44" y="460" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">색과 표면 온도를 확인한 자료를 찾아</text><text x="44" y="493" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">기록한다.</text><text x="30" y="575" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">천체 관측 자료나 천문 자료에서 값을 조사하여 빈</text><text x="30" y="603" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">기록을 채우는 안내</text></g></svg>
