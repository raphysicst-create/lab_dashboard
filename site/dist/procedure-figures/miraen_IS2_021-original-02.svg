<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img"><title>아마존 숲의 장기 변화</title><desc>위성 영상 대신 관측 내용을 정리한 자료</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="370" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">아마존 숲의 장기 변화</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">비교 시기</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">2000년과 2019년</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">관측 특징</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">약 20년 사이 열대우림 면적 약 7% 감소</text><text x="24" y="323" font-size="21" fill="#56717d">위성 영상 대신 관측 내용을 정리한 자료</text></g></svg>
