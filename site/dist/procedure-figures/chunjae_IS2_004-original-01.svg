<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 902" role="img"><title>먹이 종류와 핀치 부리</title><desc>먹이 이용과 연결되는 형태의 단순 모형</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="902" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">먹이 종류와 핀치 부리</text><text x="28" y="117" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">식물 잎</text><circle cx="380" cy="172" r="41" fill="#e2eced" stroke="#286d82" stroke-width="2"/><circle cx="391" cy="160" r="4" fill="#193746" stroke="#286d82" stroke-width="2"/><polygon points="412,160 477,174 412,184" fill="#d9ac66" stroke="#917343" stroke-width="2"/><text x="28" y="237" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">잎을 잘라 먹는 부리</text><text x="28" y="302" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">나뭇가지로 꺼낸 곤충</text><circle cx="380" cy="357" r="41" fill="#e2eced" stroke="#286d82" stroke-width="2"/><circle cx="391" cy="345" r="4" fill="#193746" stroke="#286d82" stroke-width="2"/><polygon points="412,345 537,359 412,369" fill="#d9ac66" stroke="#917343" stroke-width="2"/><text x="28" y="422" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">가늘고 뾰족한 부리</text><text x="28" y="487" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">단단한 씨</text><circle cx="380" cy="542" r="41" fill="#e2eced" stroke="#286d82" stroke-width="2"/><circle cx="391" cy="530" r="4" fill="#193746" stroke="#286d82" stroke-width="2"/><polygon points="412,513 477,544 412,571" fill="#d9ac66" stroke="#917343" stroke-width="2"/><text x="28" y="607" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">두껍고 강한 부리</text><text x="28" y="672" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">선인장 꽃·과육</text><circle cx="380" cy="727" r="41" fill="#e2eced" stroke="#286d82" stroke-width="2"/><circle cx="391" cy="715" r="4" fill="#193746" stroke="#286d82" stroke-width="2"/><polygon points="412,715 537,729 412,739" fill="#d9ac66" stroke="#917343" stroke-width="2"/><text x="28" y="792" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">길게 뻗은 부리</text><text x="24" y="855" font-size="21" fill="#56717d">먹이 이용과 연결되는 형태의 단순 모형</text></g></svg>
