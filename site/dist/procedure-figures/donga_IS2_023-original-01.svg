<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 578" role="img"><title>복사 에너지의 연결 경로</title><desc>화살표 크기는 정량값을 나타내지 않음</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="578" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">복사 에너지의 연결 경로</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">태양 → 대기·지표</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">일부 반사, 일부 흡수</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">지표 → 대기·우주</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">지구 복사 방출</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">대기 → 지표·우주</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">흡수한 에너지 재방출</text><rect x="22" y="404" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="404" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="439" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">비교할 조건</text><text x="42" y="477" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">온실 기체가 늘어났을 때 각 경로의 변화</text><text x="24" y="531" font-size="21" fill="#56717d">화살표 크기는 정량값을 나타내지 않음</text></g></svg>
