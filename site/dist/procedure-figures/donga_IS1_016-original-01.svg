<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1119" role="img"><title>두 가닥으로 만드는 DNA</title><desc>새 종이 부품의 당·인산을 테이프로 잇고 염기를 안쪽으로 연결</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="1119" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">두 가닥으로 만드는 DNA</text><rect x="25" y="110" width="590" height="125" rx="0" fill="#ffffff" stroke="#829aa4"/><circle cx="85" cy="172" r="25" fill="#f1dcad" stroke="#286d82" stroke-width="2"/><text x="85" y="181" font-size="25" fill="#183a4d" font-weight="400" text-anchor="middle">P</text><line x1="110" y1="172" x2="160" y2="172" stroke="#286d82" stroke-width="3"/><polygon points="160,152 195,132 230,152 217,193 173,193" fill="#dcebed" stroke="#286d82" stroke-width="2"/><text x="195" y="175" font-size="23" fill="#183a4d" font-weight="400" text-anchor="middle">당</text><line x1="230" y1="172" x2="285" y2="172" stroke="#286d82" stroke-width="3"/><rect x="285" y="137" width="260" height="70" rx="0" fill="#e4eff2" stroke="#377e91"/><text x="415" y="184" font-size="36" fill="#183a4d" font-weight="700" text-anchor="middle">A</text><rect x="25" y="255" width="590" height="125" rx="0" fill="#ffffff" stroke="#829aa4"/><circle cx="85" cy="317" r="25" fill="#f1dcad" stroke="#286d82" stroke-width="2"/><text x="85" y="326" font-size="25" fill="#183a4d" font-weight="400" text-anchor="middle">P</text><line x1="110" y1="317" x2="160" y2="317" stroke="#286d82" stroke-width="3"/><polygon points="160,297 195,277 230,297 217,338 173,338" fill="#dcebed" stroke="#286d82" stroke-width="2"/><text x="195" y="320" font-size="23" fill="#183a4d" font-weight="400" text-anchor="middle">당</text><line x1="230" y1="317" x2="285" y2="317" stroke="#286d82" stroke-width="3"/><rect x="285" y="282" width="260" height="70" rx="0" fill="#e4eff2" stroke="#377e91"/><text x="415" y="329" font-size="36" fill="#183a4d" font-weight="700" text-anchor="middle">T</text><rect x="25" y="400" width="590" height="125" rx="0" fill="#ffffff" stroke="#829aa4"/><circle cx="85" cy="462" r="25" fill="#f1dcad" stroke="#286d82" stroke-width="2"/><text x="85" y="471" font-size="25" fill="#183a4d" font-weight="400" text-anchor="middle">P</text><line x1="110" y1="462" x2="160" y2="462" stroke="#286d82" stroke-width="3"/><polygon points="160,442 195,422 230,442 217,483 173,483" fill="#dcebed" stroke="#286d82" stroke-width="2"/><text x="195" y="465" font-size="23" fill="#183a4d" font-weight="400" text-anchor="middle">당</text><line x1="230" y1="462" x2="285" y2="462" stroke="#286d82" stroke-width="3"/><rect x="285" y="427" width="260" height="70" rx="0" fill="#e4eff2" stroke="#377e91"/><text x="415" y="474" font-size="36" fill="#183a4d" font-weight="700" text-anchor="middle">G</text><rect x="25" y="545" width="590" height="125" rx="0" fill="#ffffff" stroke="#829aa4"/><circle cx="85" cy="607" r="25" fill="#f1dcad" stroke="#286d82" stroke-width="2"/><text x="85" y="616" font-size="25" fill="#183a4d" font-weight="400" text-anchor="middle">P</text><line x1="110" y1="607" x2="160" y2="607" stroke="#286d82" stroke-width="3"/><polygon points="160,587 195,567 230,587 217,628 173,628" fill="#dcebed" stroke="#286d82" stroke-width="2"/><text x="195" y="610" font-size="23" fill="#183a4d" font-weight="400" text-anchor="middle">당</text><line x1="230" y1="607" x2="285" y2="607" stroke="#286d82" stroke-width="3"/><rect x="285" y="572" width="260" height="70" rx="0" fill="#e4eff2" stroke="#377e91"/><text x="415" y="619" font-size="36" fill="#183a4d" font-weight="700" text-anchor="middle">C</text><rect x="22" y="705" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="705" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="740" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">01</text><text x="42" y="778" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">P는 인산을 뜻함</text><rect x="22" y="809" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="809" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="844" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">02</text><text x="42" y="882" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">당–인산을 연결하여 골격을 만들기</text><rect x="22" y="913" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="913" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="948" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">03</text><text x="42" y="986" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">염기 A–T, G–C를 서로 연결하기</text><text x="24" y="1040" font-size="21" fill="#56717d">새 종이 부품의 당·인산을 테이프로 잇고 염기를</text><text x="24" y="1072" font-size="21" fill="#56717d">안쪽으로 연결</text></g></svg>
