<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 682" role="img"><title>에너지 출입을 찾아볼 상황</title><desc>사실 관계를 정리한 학습 자료</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="682" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">에너지 출입을 찾아볼 상황</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">냉방</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">액체 냉매의 기화</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">조리·난방</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">연료의 연소</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">식물</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">빛을 받아 영양분 합성</text><rect x="22" y="404" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="404" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="439" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">생물의 체온</text><text x="42" y="477" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">세포호흡</text><rect x="22" y="508" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="508" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="543" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">음료</text><text x="42" y="581" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">차가운 음료와 몸 사이 열 이동</text><text x="24" y="635" font-size="21" fill="#56717d">사실 관계를 정리한 학습 자료</text></g></svg>
