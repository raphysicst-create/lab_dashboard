<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 578" role="img"><title>하이브리드의 주행별 흐름</title><desc>제시된 작동 사례를 단계별로 정리</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="578" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">하이브리드의 주행별 흐름</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">시동</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">전기 모터로 작동</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">가속·오르막</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">엔진 + 전기 모터</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">감속·내리막</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">운동 → 전기 → 배터리 충전</text><rect x="22" y="404" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="404" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="439" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">정속</text><text x="42" y="477" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">효율 좋은 엔진 구간에서 엔진 사용</text><text x="24" y="531" font-size="21" fill="#56717d">제시된 작동 사례를 단계별로 정리</text></g></svg>
