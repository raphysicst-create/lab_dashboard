<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 509" role="img"><title>같은 주기와 같은 족</title><desc>사실 관계를 정리한 학습 자료</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="509" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">같은 주기와 같은 족</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">2주기</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">전자 껍질 2개 / 최외각 전자 1~8개</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">3주기</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">전자 껍질 3개 / 최외각 전자 1~8개</text><rect x="22" y="300" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">같은 족</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">Li–Na, Be–Mg, B–Al, C–Si, N–P, O–S,</text><text x="42" y="408" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">F–Cl, Ne–Ar</text><text x="24" y="462" font-size="21" fill="#56717d">사실 관계를 정리한 학습 자료</text></g></svg>
