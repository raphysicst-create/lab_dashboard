<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 472" role="img"><title>개발 방식에 따른 기후 전망</title><desc>도표의 2100년 눈금을 읽은 근삿값 · 두 전망의 비교용</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="472" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">개발 방식에 따른 기후 전망</text><rect x="22" y="92" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">계속 증가하는 화석 연료 사용</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">2100년 기온 변화 약 +6 ℃ / 강수량 변화</text><text x="42" y="200" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">약 +11%</text><rect x="22" y="231" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="231" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="266" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">연료 사용을 줄이는 개발</text><text x="42" y="304" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">2100년 기온 변화 약 +2 ℃ / 강수량 변화</text><text x="42" y="339" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">약 +5%</text><text x="24" y="393" font-size="21" fill="#56717d">도표의 2100년 눈금을 읽은 근삿값 · 두 전망의</text><text x="24" y="425" font-size="21" fill="#56717d">비교용</text></g></svg>
