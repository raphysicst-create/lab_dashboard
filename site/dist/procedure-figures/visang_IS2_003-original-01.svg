<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 682" role="img"><title>대멸종을 조사할 다섯 경계</title><desc>생물 과의 감소가 나타난 다섯 시기의 조사 카드</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="682" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">대멸종을 조사할 다섯 경계</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">01</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">오르도비스기 말</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">02</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">데본기 후기</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">03</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">페름기 말</text><rect x="22" y="404" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="404" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="439" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">04</text><text x="42" y="477" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">트라이아스기 말</text><rect x="22" y="508" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="508" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="543" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">05</text><text x="42" y="581" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">백악기 말</text><text x="24" y="635" font-size="21" fill="#56717d">생물 과의 감소가 나타난 다섯 시기의 조사 카드</text></g></svg>
