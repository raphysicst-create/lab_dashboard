<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" role="img" aria-labelledby="title desc"><title id="title">평면거울 실험의 기준</title><desc id="desc">거울의 중앙을 지나는 수직선이 법선이다. 법선에 대한 입사각 30도와 60도를 구분한 배치 개념도. 과녁은 거울 앞쪽 옆에 둔다.</desc><rect width="600" height="580" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">평면거울 실험의 기준</text><line x1="80" y1="320" x2="510" y2="320" stroke="#4c6d89" stroke-width="8"/><line x1="300" y1="120" x2="300" y2="460" stroke="#98a8b5" stroke-width="3" stroke-dasharray="9 6"/><text x="300" y="96" font-size="23" fill="#21394a" text-anchor="middle" font-weight="normal">법선</text><text x="300" y="492" font-size="23" fill="#21394a" text-anchor="middle" font-weight="normal">거울면</text><line x1="215.0" y1="172.7756813566454" x2="300" y2="320" stroke="#d57636" stroke-width="3"/><polygon points="300.0,320.0 290.9,313.8 299.2,309.0" fill="#d57636"/><text x="209.0" y="158.7756813566454" font-size="24" fill="#d57636" text-anchor="middle" font-weight="normal">30°</text><line x1="152.77568135664544" y1="235.0" x2="300" y2="320" stroke="#a35b85" stroke-width="3"/><polygon points="300.0,320.0 289.0,319.2 293.8,310.9" fill="#a35b85"/><text x="146.77568135664544" y="221.0" font-size="24" fill="#a35b85" text-anchor="middle" font-weight="normal">60°</text><rect x="450" y="148" width="65" height="95" rx="4" fill="#fff1d4" stroke="#ba8a4b"/><text x="482" y="184" font-size="20" fill="#21394a" text-anchor="middle" font-weight="normal">과녁</text><text x="300" y="550" font-size="21" fill="#21394a" text-anchor="middle" font-weight="normal">입사각과 반사각은 법선을 기준으로 잰다.</text></g></svg>
