<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 559" role="img" aria-labelledby="title desc"><title id="title">북적도 해류가 약한 경우</title><desc id="desc">동태평양 수온 상승과 주변 강수, 인도네시아 산불·호주 가뭄·미국 12월 개화 사례를 지리 지도 없이 새 카드로 정리했다.</desc><rect width="600" height="559" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">북적도 해류가 약한 경우</text><rect x="25" y="80" width="550" height="123" rx="12" fill="#eaf2f4" stroke="none"/><text x="42" y="114" font-size="25" fill="#21394a" text-anchor="start" font-weight="bold">동태평양</text><text x="42" y="150" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">평상시보다 높은 수온, 주변 지역의 집중호우</text><rect x="25" y="223" width="550" height="123" rx="12" fill="#eaf2f4" stroke="none"/><text x="42" y="257" font-size="25" fill="#21394a" text-anchor="start" font-weight="bold">서태평양 주변</text><text x="42" y="293" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">인도네시아 산불, 호주 가뭄</text><rect x="25" y="366" width="550" height="123" rx="12" fill="#eaf2f4" stroke="none"/><text x="42" y="400" font-size="25" fill="#21394a" text-anchor="start" font-weight="bold">미국</text><text x="42" y="436" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">12월 벚꽃 개화 사례</text><text x="28" y="524" font-size="20" fill="#21394a" text-anchor="start" font-weight="normal">지역별 사례이며 항상 발생하는 법칙은 아니다.</text></g></svg>
