<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 544" role="img"><title>기온 상승 시나리오의 조건</title><desc>기온 전망은 도표의 근삿값 · +3 ℃는 별도의 가정</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="544" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">기온 상승 시나리오의 조건</text><rect x="22" y="92" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">화석 연료 사용 증가</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">2000년 대비 2050년 약 +2 ℃, 2100년 약 +6</text><text x="42" y="200" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">℃</text><rect x="22" y="231" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="231" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="266" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">평균 기온 +3 ℃ 가정</text><text x="42" y="304" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">열대우림 변화 · 영구동토 해빙 · 질병 위험</text><text x="42" y="339" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">증가</text><rect x="22" y="370" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="370" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="405" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">탐구</text><text x="42" y="443" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">2050년 상황과 대응책을 구분하여 구성</text><text x="24" y="497" font-size="21" fill="#56717d">기온 전망은 도표의 근삿값 · +3 ℃는 별도의 가정</text></g></svg>
