<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img"><title>극지 환경 관측의 변화</title><desc>지도 대신 관측 특징을 요약한 비교 자료</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="440" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">극지 환경 관측의 변화</text><rect x="22" y="92" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">북극해 얼음</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">1980년 10월 → 2020년 10월: 분포 면적</text><text x="42" y="200" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">감소</text><rect x="22" y="231" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="231" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="266" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">남극 상공 오존</text><text x="42" y="304" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">1979년 10월 → 2022년 10월: 낮은 농도</text><text x="42" y="339" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">영역 확대</text><text x="24" y="393" font-size="21" fill="#56717d">지도 대신 관측 특징을 요약한 비교 자료</text></g></svg>
