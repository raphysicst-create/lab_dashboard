<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 757" role="img" aria-labelledby="title desc"><title id="title">북태평양 순환의 단서</title><desc id="desc">북반구 저위도 바람: 북동 무역풍: 동쪽에서 서쪽으로 치우쳐 분다. 북반구 중위도 바람: 편서풍: 서쪽에서 동쪽으로 치우쳐 분다. 연안의 상대적 수온: 서쪽 연안은 같은 위도의 동쪽 연안보다 따뜻한 경향이 나타난다. 그릴 내용: 바람에 따른 동서 흐름과 연안의 남북 흐름을 연결한다.</desc><rect width="600" height="757" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">북태평양 순환의 단서</text><rect x="25" y="75" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="108" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">북반구 저위도 바람</text><text x="44" y="140" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">북동 무역풍: 동쪽에서 서쪽으로 치우쳐</text><text x="44" y="173" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">분다.</text><rect x="25" y="235" width="550" height="113" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="268" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">북반구 중위도 바람</text><text x="44" y="300" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">편서풍: 서쪽에서 동쪽으로 치우쳐 분다.</text><rect x="25" y="362" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="395" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">연안의 상대적 수온</text><text x="44" y="427" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">서쪽 연안은 같은 위도의 동쪽 연안보다</text><text x="44" y="460" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">따뜻한 경향이 나타난다.</text><rect x="25" y="522" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="555" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">그릴 내용</text><text x="44" y="587" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">바람에 따른 동서 흐름과 연안의 남북 흐름을</text><text x="44" y="620" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">연결한다.</text><text x="30" y="702" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">실측 8월 수온 지도를 모사하지 않은 정성 관계표</text></g></svg>
