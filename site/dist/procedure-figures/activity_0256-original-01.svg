<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" role="img"><title>관측 위치가 달라질 때 보이는 방향</title><style>text{font-family:Arial,"Malgun Gothic",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style><rect width="640" height="620" fill="white"/><text x="26" y="40" font-size="27" fill="#24364b" text-anchor="start" font-weight="bold">관측 위치가 달라질 때 보이는 방향</text><line x1="26" y1="56" x2="614" y2="56" stroke="#dce5ee" stroke-width="2"/><line x1="65" y1="120" x2="575" y2="120" stroke="#64748b" stroke-width="2"/><text x="320" y="91" font-size="23" fill="#24364b" text-anchor="middle" font-weight="normal">멀리 있는 기준 배경</text><line x1="175" y1="430" x2="465" y2="430" stroke="#11756c" stroke-width="2"/><circle cx="175" cy="430" r="10" fill="#11756c" stroke="none" stroke-width="2"/><circle cx="465" cy="430" r="10" fill="#11756c" stroke="none" stroke-width="2"/><text x="175" y="472" font-size="23" fill="#24364b" text-anchor="middle" font-weight="normal">첫 관측점</text><text x="465" y="472" font-size="23" fill="#24364b" text-anchor="middle" font-weight="normal">둘째 관측점</text><circle cx="320" cy="430" r="12" fill="#b84d22" stroke="none" stroke-width="2"/><text x="320" y="466" font-size="21" fill="#24364b" text-anchor="middle" font-weight="normal">태양</text><circle cx="90" cy="120" r="8" fill="#2563a6" stroke="none" stroke-width="2"/><text x="90" y="159" font-size="24" fill="#24364b" text-anchor="middle" font-weight="normal">A₂</text><circle cx="220" cy="120" r="8" fill="#2563a6" stroke="none" stroke-width="2"/><text x="220" y="159" font-size="24" fill="#24364b" text-anchor="middle" font-weight="normal">B₂</text><circle cx="420" cy="120" r="8" fill="#2563a6" stroke="none" stroke-width="2"/><text x="420" y="159" font-size="24" fill="#24364b" text-anchor="middle" font-weight="normal">B₁</text><circle cx="550" cy="120" r="8" fill="#2563a6" stroke="none" stroke-width="2"/><text x="550" y="159" font-size="24" fill="#24364b" text-anchor="middle" font-weight="normal">A₁</text><text x="75" y="525" font-size="21" fill="#24364b" text-anchor="start" font-weight="normal">각 관측점에서 같은 번호의 A, B 표식을 향해 선을</text><text x="75" y="556" font-size="21" fill="#24364b" text-anchor="start" font-weight="normal">그어 별의 위치를 찾는다.</text><text x="26" y="604" font-size="14" fill="#64748b" text-anchor="start" font-weight="normal">직접 구성한 학습용 도식 · 크기와 거리는 실제 비율이 아님</text></svg>