<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img"><title>연못의 구성 요소 목록</title><desc>생태계 구성 요소를 분류하기 위한 개념 모형</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="440" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">연못의 구성 요소 목록</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">비생물 요소</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">공기 · 빛 · 온도 · 물 · 토양</text><rect x="22" y="196" width="596" height="160" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="160" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">생물 요소</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">나무 · 버섯 · 부들 · 수련 · 부레옥잠 ·</text><text x="42" y="304" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">검정말 · 오리 · 개구리 · 붕어 · 다슬기 ·</text><text x="42" y="339" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">짚신벌레</text><text x="24" y="393" font-size="21" fill="#56717d">생태계 구성 요소를 분류하기 위한 개념 모형</text></g></svg>
