<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img"><title>질량으로 비교한 구성 원소</title><desc>사실 관계를 정리한 학습 자료</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="510" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">질량으로 비교한 구성 원소</text><rect x="22" y="92" width="596" height="160" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="160" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">지구</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">철 35.0% · 산소 30.0% · 규소 15.0% ·</text><text x="42" y="200" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">마그네슘 13.0% · 니켈 2.4% · 황 1.9% ·</text><text x="42" y="235" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">칼슘 1.1% · 알루미늄 1.1% · 기타 0.5%</text><rect x="22" y="266" width="596" height="160" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="266" width="6" height="160" rx="0" fill="#26748a" stroke="none"/><text x="42" y="301" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">사람</text><text x="42" y="339" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">산소 65.0% · 탄소 18.5% · 수소 9.5% ·</text><text x="42" y="374" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">질소 3.3% · 칼슘 1.5% · 인 1.0% · 기타</text><text x="42" y="409" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">1.2%</text><text x="24" y="463" font-size="21" fill="#56717d">사실 관계를 정리한 학습 자료</text></g></svg>
