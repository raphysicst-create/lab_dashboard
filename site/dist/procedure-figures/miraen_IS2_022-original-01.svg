<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 506" role="img"><title>평균 기온과 이산화 탄소 추세</title><desc>주어진 기간의 관측 요약 · 농도는 도표 눈금의 근삿값</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="506" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">평균 기온과 이산화 탄소 추세</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">기온 차이</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">2023년 − 1950년: 약 +1.17 ℃</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">30년 평균의 차이</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">1994~2023년 − 1950~1979년: 약 +0.61 ℃</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">대기 이산화 탄소</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">1950년 약 310 ppm → 2023년 약 420 ppm</text><text x="24" y="427" font-size="21" fill="#56717d">주어진 기간의 관측 요약 · 농도는 도표 눈금의</text><text x="24" y="459" font-size="21" fill="#56717d">근삿값</text></g></svg>
