<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 544" role="img"><title>일주일 기상 자료의 단위</title><desc>월요일부터 일요일까지의 항목별 자료</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="544" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">일주일 기상 자료의 단위</text><rect x="22" y="92" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">기온</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">최저 9, 7, 8, 8, 9, 9, 13 ℃ / 최고 17,</text><text x="42" y="200" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">16, 18, 20, 21, 24, 26 ℃</text><rect x="22" y="231" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="231" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="266" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">강수</text><text x="42" y="304" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">확률 5, 5, 5, 5, 5, 5, 20% / 강수량은</text><text x="42" y="339" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">모두 1 mm 미만</text><rect x="22" y="370" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="370" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="405" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">바람과 습도</text><text x="42" y="443" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">풍속 m/s · 상대 습도 %</text><text x="24" y="497" font-size="21" fill="#56717d">월요일부터 일요일까지의 항목별 자료</text></g></svg>
