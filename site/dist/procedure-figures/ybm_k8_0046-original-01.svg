<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 685" role="img" aria-labelledby="title desc"><title id="title">검정말잎의 색 변화 위치</title><desc id="desc">아이오딘-아이오딘화 칼륨 용액 처리 뒤 엽록체 부근에 나타난 짙은 색을 개념적으로 표현했다. 실제 현미경 사진을 모사하거나 새 측정 결과로 제시하지 않았다.</desc><rect width="600" height="685" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">검정말잎의 색 변화 위치</text><text x="38" y="93" font-size="25" fill="#21394a" text-anchor="start" font-weight="bold">처리 전</text><rect x="160" y="110" width="285" height="140" rx="10" fill="#eff7ed" stroke="#7da46f"/><ellipse cx="180" cy="135" rx="14" ry="9" fill="#84ad65"/><ellipse cx="215" cy="222" rx="14" ry="9" fill="#84ad65"/><ellipse cx="260" cy="130" rx="14" ry="9" fill="#84ad65"/><ellipse cx="305" cy="222" rx="14" ry="9" fill="#84ad65"/><ellipse cx="360" cy="134" rx="14" ry="9" fill="#84ad65"/><ellipse cx="420" cy="210" rx="14" ry="9" fill="#84ad65"/><text x="38" y="323" font-size="25" fill="#21394a" text-anchor="start" font-weight="bold">처리 후</text><rect x="160" y="340" width="285" height="140" rx="10" fill="#eff7ed" stroke="#7da46f"/><ellipse cx="180" cy="365" rx="14" ry="9" fill="#343e5e"/><ellipse cx="215" cy="452" rx="14" ry="9" fill="#343e5e"/><ellipse cx="260" cy="360" rx="14" ry="9" fill="#343e5e"/><ellipse cx="305" cy="452" rx="14" ry="9" fill="#343e5e"/><ellipse cx="360" cy="364" rx="14" ry="9" fill="#343e5e"/><ellipse cx="420" cy="440" rx="14" ry="9" fill="#343e5e"/><text x="300" y="615" font-size="23" fill="#21394a" text-anchor="middle" font-weight="normal">색이 달라진 위치를 비교하는 모형</text><text x="300" y="653" font-size="20" fill="#21394a" text-anchor="middle" font-weight="normal">현미경 사진이 아니며 크기·개수는 비축척</text></g></svg>
