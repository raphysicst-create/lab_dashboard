<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 531" role="img" aria-labelledby="title desc"><title id="title">해역별 염분의 상대적 차이</title><desc id="desc">위도대 비교: 태평양·대서양의 적도 해역 0°~20°보다 중위도 해역 20°~30°의 표층 염분이 높다. 태평양 안에서의 비교: 같은 위도에서 담수가 들어오는 연안은 중앙 해역보다 표층 염분이 낮다.</desc><rect width="600" height="531" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">해역별 염분의 상대적 차이</text><rect x="25" y="75" width="550" height="179" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="108" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">위도대 비교</text><text x="44" y="140" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">태평양·대서양의 적도 해역 0°~20°보다</text><text x="44" y="173" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">중위도 해역 20°~30°의 표층 염분이</text><text x="44" y="206" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">높다.</text><rect x="25" y="268" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="301" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">태평양 안에서의 비교</text><text x="44" y="333" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">같은 위도에서 담수가 들어오는 연안은 중앙</text><text x="44" y="366" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">해역보다 표층 염분이 낮다.</text><text x="30" y="448" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">관측 분포에서 확인한 정성 관계를 새 표로 구성했다.</text><text x="30" y="476" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">색 지도나 새 염분 측정값은 제공하지 않는다.</text></g></svg>
