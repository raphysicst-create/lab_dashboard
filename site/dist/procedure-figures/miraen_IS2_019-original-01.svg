<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 474" role="img"><title>카이바브 고원의 변화 순서</title><desc>관측 추세 요약 · 연도별 실측 곡선 아님</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="474" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">카이바브 고원의 변화 순서</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">1905년</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">늑대 약 400마리 · 사슴 약 3,800마리</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">늑대 사냥 허용 이후</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">늑대 감소 · 1905~1920년 사슴 증가</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">1920~1930년</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">먹이 식물 감소 · 사슴 감소</text><text x="24" y="427" font-size="21" fill="#56717d">관측 추세 요약 · 연도별 실측 곡선 아님</text></g></svg>
