<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 610" role="img"><title>네 대상의 주요 원소</title><desc>대상의 생성 순서와 포함 관계를 연결하는 분류 카드</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="610" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">네 대상의 주요 원소</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">우주</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">수소 · 헬륨</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">태양계</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">수소 · 헬륨</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">지구</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">철 · 산소 · 규소</text><rect x="22" y="404" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="404" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="439" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">바닷물</text><text x="42" y="477" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">산소 · 수소</text><text x="24" y="531" font-size="21" fill="#56717d">대상의 생성 순서와 포함 관계를 연결하는 분류</text><text x="24" y="563" font-size="21" fill="#56717d">카드</text></g></svg