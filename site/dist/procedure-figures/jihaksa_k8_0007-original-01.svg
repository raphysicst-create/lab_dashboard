<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 884" role="img" aria-labelledby="title desc"><title id="title">물질별 특성 기록</title><desc id="desc">구리선: 물에 녹지 않음 / 밀도 8.96 g/cm³ / 녹는점 1085 ℃ / 끓는점 2562 ℃ 간장: 물과 섞임 / 밀도는 성분 비율에 따라 다름 / 녹는점·끓는점 일정하지 않음 산소: 물 100 g에 0.0044 g 용해 / 밀도 1.429 g/L / 녹는점 −219 ℃ / 끓는점 −183 ℃ 동전: 물에 녹지 않음 / 밀도는 성분 비율에 따라 다름 / 녹는점·끓는점 일정하지 않음</desc><rect width="600" height="884" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">물질별 특성 기록</text><rect x="25" y="75" width="550" height="179" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="108" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">구리선</text><text x="44" y="140" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">물에 녹지 않음 / 밀도 8.96 g/cm³</text><text x="44" y="173" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">/ 녹는점 1085 ℃ / 끓는점 2562</text><text x="44" y="206" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">℃</text><rect x="25" y="268" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="301" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">간장</text><text x="44" y="333" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">물과 섞임 / 밀도는 성분 비율에 따라 다름</text><text x="44" y="366" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">/ 녹는점·끓는점 일정하지 않음</text><rect x="25" y="428" width="550" height="179" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="461" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">산소</text><text x="44" y="493" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">물 100 g에 0.0044 g 용해 /</text><text x="44" y="526" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">밀도 1.429 g/L / 녹는점 −219</text><text x="44" y="559" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">℃ / 끓는점 −183 ℃</text><rect x="25" y="621" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="654" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">동전</text><text x="44" y="686" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">물에 녹지 않음 / 밀도는 성분 비율에 따라</text><text x="44" y="719" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">다름 / 녹는점·끓는점 일정하지 않음</text><text x="30" y="801" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">용해도: 20 ℃의 물 기준 / 밀도: 0 ℃ 기준.</text><text x="30" y="829" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">물질 특성값을 비교하는 자료.</text></g></svg>
