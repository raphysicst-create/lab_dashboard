<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 474" role="img"><title>반응 전후의 관찰 정보</title><desc>원본 장면 대신 관찰 사실을 독립적으로 정리</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="474" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">반응 전후의 관찰 정보</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">가열 전 고체</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">검은 혼합물</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">가열 후 고체</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">붉은색 물질 생성</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">발생 기체를 통과시킨 석회수</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">뿌옇게 변함</text><text x="24" y="427" font-size="21" fill="#56717d">원본 장면 대신 관찰 사실을 독립적으로 정리</text></g></svg>
