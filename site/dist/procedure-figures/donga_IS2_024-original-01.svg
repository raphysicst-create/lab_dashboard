<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 683" role="img"><title>기온 상승별 변화 전망</title><desc>각 지표를 같은 상승 조건끼리 비교하는 자료</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="683" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">기온 상승별 변화 전망</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">기준</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">산업화 이전 1850~1900년 대비</text><rect x="22" y="196" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">평균 +1.5 ℃</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">최고 +1.9 ℃ / 가뭄 2.0배 / 강수 1.5배 /</text><text x="42" y="304" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">강설 −5% / 태풍 +10%</text><rect x="22" y="335" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="335" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="370" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">평균 +2 ℃</text><text x="42" y="408" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">최고 +2.6 ℃ / 가뭄 2.4배 / 강수 1.7배 /</text><text x="42" y="443" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">강설 −9% / 태풍 +13%</text><rect x="22" y="474" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="474" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="509" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">평균 +4 ℃</text><text x="42" y="547" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">최고 +5.1 ℃ / 가뭄 4.1배 / 강수 2.7배 /</text><text x="42" y="582" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">강설 −26% / 태풍 +30%</text><text x="24" y="636" font-size="21" fill="#56717d">각 지표를 같은 상승 조건끼리 비교하는 자료</text></g></svg>
