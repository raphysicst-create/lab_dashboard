<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-labelledby="title desc"><title id="title">맹점을 찾는 두 표지</title><desc id="desc">왼쪽에는 십자 응시점, 오른쪽에는 원형 관찰 표지를 두었다. 왼쪽 눈을 가리고 오른쪽 눈으로 십자를 보면서 거리를 바꾼다.</desc><rect width="600" height="500" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">맹점을 찾는 두 표지</text><text x="120" y="130" font-size="24" fill="#21394a" text-anchor="middle" font-weight="normal">응시점</text><text x="450" y="130" font-size="24" fill="#21394a" text-anchor="middle" font-weight="normal">관찰 표지</text><line x1="100" y1="260" x2="140" y2="260" stroke="#2e586d" stroke-width="7"/><line x1="120" y1="240" x2="120" y2="280" stroke="#2e586d" stroke-width="7"/><circle cx="450" cy="260" r="20" fill="#bc743c" stroke="none" stroke-width="3"/><text x="300" y="370" font-size="21" fill="#21394a" text-anchor="middle" font-weight="normal">왼쪽 눈을 가리고 오른쪽 눈으로 +를 본다.</text><text x="300" y="415" font-size="21" fill="#21394a" text-anchor="middle" font-weight="normal">시선을 고정한 채 그림과의 거리를 바꾼다.</text><text x="300" y="462" font-size="22" fill="#21394a" text-anchor="middle" font-weight="normal">오른쪽 원이 계속 보이는지 관찰한다.</text></g></svg>
