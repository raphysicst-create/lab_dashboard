<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 658" role="img" aria-labelledby="title desc"><title id="title">별의 색과 온도 조사</title><desc id="desc">프로키온: 관찰 자료에서 색을 확인하고 표면 온도를 조사한다. 베텔게우스: 관찰 자료에서 색을 확인하고 표면 온도를 조사한다. 시리우스: 관찰 자료에서 색을 확인하고 표면 온도를 조사한다.</desc><rect width="600" height="658" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">별의 색과 온도 조사</text><rect x="25" y="75" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="108" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">프로키온</text><text x="44" y="140" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">관찰 자료에서 색을 확인하고 표면 온도를</text><text x="44" y="173" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">조사한다.</text><rect x="25" y="235" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="268" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">베텔게우스</text><text x="44" y="300" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">관찰 자료에서 색을 확인하고 표면 온도를</text><text x="44" y="333" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">조사한다.</text><rect x="25" y="395" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="428" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">시리우스</text><text x="44" y="460" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">관찰 자료에서 색을 확인하고 표면 온도를</text><text x="44" y="493" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">조사한다.</text><text x="30" y="575" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">별 사진을 대체한 조사 기록 틀. 확인한 색·온도와</text><text x="30" y="603" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">자료 출처를 함께 적는다.</text></g></svg>
