<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 902" role="img"><title>섬의 먹이와 부리 특징</title><desc>사실 관계를 정리한 학습 자료</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="902" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">섬의 먹이와 부리 특징</text><text x="28" y="117" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">곤충</text><circle cx="380" cy="172" r="41" fill="#e2eced" stroke="#286d82" stroke-width="2"/><circle cx="391" cy="160" r="4" fill="#193746" stroke="#286d82" stroke-width="2"/><polygon points="412,160 537,174 412,184" fill="#d9ac66" stroke="#917343" stroke-width="2"/><text x="28" y="237" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">가늘고 뾰족함</text><text x="28" y="302" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">크고 단단한 씨</text><circle cx="380" cy="357" r="41" fill="#e2eced" stroke="#286d82" stroke-width="2"/><circle cx="391" cy="345" r="4" fill="#193746" stroke="#286d82" stroke-width="2"/><polygon points="412,345 477,359 412,369" fill="#d9ac66" stroke="#917343" stroke-width="2"/><text x="28" y="422" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">크고 튼튼함</text><text x="28" y="487" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">선인장</text><circle cx="380" cy="542" r="41" fill="#e2eced" stroke="#286d82" stroke-width="2"/><circle cx="391" cy="530" r="4" fill="#193746" stroke="#286d82" stroke-width="2"/><polygon points="412,530 537,544 412,554" fill="#d9ac66" stroke="#917343" stroke-width="2"/><text x="28" y="607" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">가시보다 길게 뻗음</text><text x="28" y="672" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">부드러운 열매</text><circle cx="380" cy="727" r="41" fill="#e2eced" stroke="#286d82" stroke-width="2"/><circle cx="391" cy="715" r="4" fill="#193746" stroke