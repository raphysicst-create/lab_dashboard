<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 422" role="img"><title>사진을 비교할 때 확인할 조건</title><style>text{font-family:Arial,"Malgun Gothic",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style><rect width="640" height="422" fill="white"/><text x="26" y="40" font-size="27" fill="#24364b" text-anchor="start" font-weight="bold">사진을 비교할 때 확인할 조건</text><line x1="26" y1="56" x2="614" y2="56" stroke="#dce5ee" stroke-width="2"/><rect x="26" y="75" width="150" height="54" rx="0" fill="#e6f0f8" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="110" font-size="23" fill="#24364b" text-anchor="start" font-weight="bold">조건</text><rect x="176" y="75" width="438" height="54" rx="0" fill="#e6f0f8" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="110" font-size="23" fill="#24364b" text-anchor="start" font-weight="bold">비교할 내용</text><rect x="26" y="129" width="150" height="53" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="159" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">관측 장소</text><rect x="176" y="129" width="438" height="53" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="159" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">우리나라에서 촬영한 자료인지</text><rect x="26" y="182" width="150" height="53" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="212" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">관측 시기</text><rect x="176" y="182" width="438" height="53" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="212" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">여름·겨울 중 어느 계절인지</text><rect x="26" y="235" width="150" height="53" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="265" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">보이는 띠</text><rect x="176" y="235" width="438" height="53" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="265" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">상대적인 밝기와 넓이</text><rect x="26" y="288" width="150" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="318" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">사진 정보</text><rect x="176" y="288" width="438" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="318" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">촬영·보정 조건이 달라 보일</text><text x="188" y="349" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">가능성</text><text x="26" y="406" font-size="14" fill="#64748b" text-anchor="start" font-weight="normal">관찰 안내 · 실제 관측값이 아님</text></svg>