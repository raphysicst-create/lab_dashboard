<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 474" role="img"><title>물과 에너지가 이동하는 현상</title><desc>기상 사진의 현상을 글과 관계로 정리한 자료</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="474" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">물과 에너지가 이동하는 현상</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">해안</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">바람이 수면에 파도를 만듦</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">하늘</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">구름 사이로 햇빛이 들어옴</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">논과 수로</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">물이 지표를 따라 이동함</text><text x="24" y="427" font-size="21" fill="#56717d">기상 사진의 현상을 글과 관계로 정리한 자료</text></g></svg>
