<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 613" role="img"><title>태양에서 생활까지</title><desc>에너지 전환의 관계를 정리한 개념 자료</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="613" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">태양에서 생활까지</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">(가) 텔레비전</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">전기 → 빛·소리</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">(나) 헤어드라이어</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">전기 → 열·운동</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">(다) 태양광 장치</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">빛 → 전기</text><rect x="22" y="404" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="404" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="439" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">연결 과제</text><text x="42" y="477" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">태양 에너지가 전기에 이르는 경로도</text><text x="42" y="512" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">생각하기</text><text x="24" y="566" font-size="21" fill="#56717d">에너지 전환의 관계를 정리한 개념 자료</text></g></svg>
