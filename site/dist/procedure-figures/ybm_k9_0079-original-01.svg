<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 785" role="img" aria-labelledby="title desc"><title id="title">가상 가족의 혈액형 조건</title><desc id="desc">첫 세대 · 아버지 쪽: 할아버지 O형, 할머니 A형 → 아버지 A형 첫 세대 · 어머니 쪽: 외할아버지 O형, 외할머니 B형 → 어머니 B형 둘째·셋째 세대: 아버지 A형과 어머니 B형 사이에 O형 아들과 B형 딸이 있다. 추론할 대상: 이 가족의 다음 자녀, 그리고 B형 딸과 AB형 배우자 사이의 자녀</desc><rect width="600" height="785" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">가상 가족의 혈액형 조건</text><rect x="25" y="75" width="550" height="113" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="108" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">첫 세대 · 아버지 쪽</text><text x="44" y="140" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">할아버지 O형, 할머니 A형 → 아버지 A형</text><rect x="25" y="202" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="235" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">첫 세대 · 어머니 쪽</text><text x="44" y="267" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">외할아버지 O형, 외할머니 B형 → 어머니</text><text x="44" y="300" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">B형</text><rect x="25" y="362" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="395" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">둘째·셋째 세대</text><text x="44" y="427" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">아버지 A형과 어머니 B형 사이에 O형</text><text x="44" y="460" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">아들과 B형 딸이 있다.</text><rect x="25" y="522" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="555" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">추론할 대상</text><text x="44" y="587" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">이 가족의 다음 자녀, 그리고 B형 딸과</text><text x="44" y="620" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">AB형 배우자 사이의 자녀</text><text x="30" y="702" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">교육용 가상 사례이며 A·B·O의 대립유전자 관계를</text><text x="30" y="730" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">적용한다.</text></g></svg>
