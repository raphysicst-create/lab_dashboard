<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 719" role="img" aria-labelledby="title desc"><title id="title">중추신경계 구조 조사 틀</title><desc id="desc">뇌의 부분: 대뇌 · 사이뇌 · 중간뇌 · 소뇌 · 숨골 뇌와 연결되는 부분: 척수 조사하여 표시할 내용: 각 부분의 위치, 이웃한 구조, 맡은 기능 모둠의 결과물: 해부 구조 자료를 확인하며 각자 독립적으로 그린 부분을 합친다.</desc><rect width="600" height="719" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">중추신경계 구조 조사 틀</text><rect x="25" y="75" width="550" height="113" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="108" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">뇌의 부분</text><text x="44" y="140" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">대뇌 · 사이뇌 · 중간뇌 · 소뇌 · 숨골</text><rect x="25" y="202" width="550" height="113" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="235" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">뇌와 연결되는 부분</text><text x="44" y="267" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">척수</text><rect x="25" y="329" width="550" height="113" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="362" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">조사하여 표시할 내용</text><text x="44" y="394" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">각 부분의 위치, 이웃한 구조, 맡은 기능</text><rect x="25" y="456" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="489" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">모둠의 결과물</text><text x="44" y="521" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">해부 구조 자료를 확인하며 각자 독립적으로</text><text x="44" y="554" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">그린 부분을 합친다.</text><text x="30" y="636" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">해부 단면 그림을 대체한 구성 안내. 위치는 조사</text><text x="30" y="664" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">자료에서 확인하며 임의로 정하지 않는다.</text></g></svg>
