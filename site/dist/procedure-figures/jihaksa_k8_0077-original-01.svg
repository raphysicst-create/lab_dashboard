<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" role="img" aria-labelledby="title desc"><title id="title">관측 시점에 따른 겉보기 위치</title><desc id="desc">동일한 배경에서 시작·6개월 뒤·1년 뒤의 위치를 보이는 독립 모형. A의 위치 차이가 B보다 크고 1년 뒤에는 처음 위치로 돌아온다. 이동량은 측정값이 아니다.</desc><rect width="600" height="680" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">관측 시점에 따른 겉보기 위치</text><rect x="25" y="90" width="550" height="144" rx="12" fill="#eaf2f4" stroke="none"/><text x="45" y="122" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">시작</text><line x1="125" y1="170" x2="540" y2="170" stroke="#c2cfd5" stroke-width="3" stroke-dasharray="5 5"/><circle cx="210" cy="170" r="9" fill="#cf783e" stroke="none" stroke-width="3"/><text x="210" y="207" font-size="23" fill="#21394a" text-anchor="middle" font-weight="normal">A</text><circle cx="410" cy="170" r="9" fill="#288e9b" stroke="none" stroke-width="3"/><text x="410" y="207" font-size="23" fill="#21394a" text-anchor="middle" font-weight="normal">B</text><rect x="25" y="250" width="550" height="144" rx="12" fill="#eaf2f4" stroke="none"/><text x="45" y="282" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">6개월 뒤</text><line x1="125" y1="330" x2="540" y2="330" stroke="#c2cfd5" stroke-width="3" stroke-dasharray="5 5"/><circle cx="310" cy="330" r="9" fill="#cf783e" stroke="none" stroke-width="3"/><text x="310" y="367" font-size="23" fill="#21394a" text-anchor="middle" font-weight="normal">A</text><circle cx="445" cy="330" r="9" fill="#288e9b" stroke="none" stroke-width="3"/><text x="445" y="367" font-size="23" fill="#21394a" text-anchor="middle" font-weight="normal">B</text><rect x="25" y="410" width="550" height="144" rx="12" fill="#eaf2f4" stroke="none"/><text x="45" y="442" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">1년 뒤</text><line x1="125" y1="490" x2="540" y2="490" stroke="#c2cfd5" stroke-width="3" stroke-dasharray="5 5"/><circle cx="210" cy="490" r="9" fill="#cf783e" stroke="none" stroke-width="3"/><text x="210" y="527" font-size="23" fill="#21394a" text-anchor="middle" font-weight="normal">A</text><circle cx="410" cy="490" r="9" fill="#288e9b" stroke="none" stroke-width="3"/><text x="410" y="527" font-size="23" fill="#21394a" text-anchor="middle" font-weight="normal">B</text><text x="30" y="615" font-size="20" fill="#21394a" text-anchor="start" font-weight="normal">가상 위치 모형 · 실제 각도/거리 자료 아님</text><text x="30" y="650" font-size="21" fill="#21394a" text-anchor="start" font-weight="normal">배경을 기준으로 옮겨 보인 정도를 비교한다.</text></g></svg>
