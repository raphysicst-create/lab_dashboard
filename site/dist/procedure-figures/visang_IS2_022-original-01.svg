<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 578" role="img"><title>기후 변화 캠페인 구상판</title><desc>특정 미술작품을 변형하지 않는 독립 창작 안내</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="578" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">기후 변화 캠페인 구상판</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">변화 선택</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">고온 · 해수면 상승 · 가뭄 등</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">근거 확인</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">환경 변화와 생물·생활 영향 조사</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">새 장면 구상</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">전달할 메시지와 장소·대상을 직접 결정</text><rect x="22" y="404" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="404" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="439" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">제작</text><text x="42" y="477" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">직접 그리거나 생성 도구로 새 이미지 구성</text><text x="24" y="531" font-size="21" fill="#56717d">특정 미술작품을 변형하지 않는 독립 창작 안내</text></g></svg>
