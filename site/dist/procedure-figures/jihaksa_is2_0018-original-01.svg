<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 474" role="img"><title>서로 영향을 주는 구성원</title><desc>관계 정리용 모형</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="474" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">서로 영향을 주는 구성원</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">생물</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">사람 · 개미 · 나무 · 민들레 · 토양 미생물</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">비생물</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">빛 · 온도 · 흙 · 공기</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">관계 찾기</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">양쪽 사이의 영향을 화살표로 연결</text><text x="24" y="427" font-size="21" fill="#56717d">관계 정리용 모형</text></g></svg>
