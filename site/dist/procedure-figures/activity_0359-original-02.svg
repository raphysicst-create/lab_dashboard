<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 661" role="img"><title>사건과 생물 이름으로 만드는 카드</title><style>text{font-family:Arial,"Malgun Gothic",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style><rect width="640" height="661" fill="white"/><text x="26" y="40" font-size="27" fill="#24364b" text-anchor="start" font-weight="bold">사건과 생물 이름으로 만드는 카드</text><line x1="26" y1="56" x2="614" y2="56" stroke="#dce5ee" stroke-width="2"/><rect x="26" y="75" width="150" height="54" rx="0" fill="#e6f0f8" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="110" font-size="23" fill="#24364b" text-anchor="start" font-weight="bold">카드 종류</text><rect x="176" y="75" width="438" height="54" rx="0" fill="#e6f0f8" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="110" font-size="23" fill="#24364b" text-anchor="start" font-weight="bold">내용</text><rect x="26" y="129" width="150" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="159" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">오염이 누적됨</text><rect x="176" y="129" width="438" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="159" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">식물 카드1장과 동물 카드1장을</text><text x="188" y="190" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">반납한다.</text><rect x="26" y="213" width="150" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="243" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">먹이 자원이</text><text x="38" y="274" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">줄어듦</text><rect x="176" y="213" width="438" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="243" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">동물 카드1장을 반납한다.</text><rect x="26" y="297" width="150" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="327" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">식물 서식지</text><text x="38" y="358" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">개선</text><rect x="176" y="297" width="438" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="327" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">추가 카드에서 식물1장을</text><text x="188" y="358" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">가져온다.</text><rect x="26" y="381" width="150" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="411" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">먹이 연결을</text><text x="38" y="442" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">회복함</text><rect x="176" y="381" width="438" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="411" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">추가 카드에서 동물1장을</text><text x="188" y="442" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">가져온다.</text><rect x="26" y="465" width="150" height="146" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="495" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">생물 카드</text><rect x="176" y="465" width="438" height="146" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="495" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">감자 · 당근 · 밀 · 벼 ·</text><text x="188" y="526" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">옥수수 · 콩 · 개구리 · 늑대</text><text x="188" y="557" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">· 돌쥐 · 매 · 메뚜기 · 뱀</text><text x="188" y="588" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">· 사슴 · 참새 · 토끼</text><text x="26" y="645" font-size="14" fill="#64748b" text-anchor="start" font-weight="normal">독립 설계 규칙 · 카드 증감은 실제 생태계 변화량이 아닌 놀이 약속</text></svg>