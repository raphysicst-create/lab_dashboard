<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 578" role="img"><title>핵산 검사에서 비교할 변화</title><desc>증폭 결과의 정성 요약 · 실제 검사 곡선 아님</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="578" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">핵산 검사에서 비교할 변화</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">처리 순서</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">검체 → 핵산 추출 → 증폭 장치 → 측정</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">증폭 반복</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">1회 → 2회 → 3회 → … → 30회</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">사람 3</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">반복 후 핵산량이 증가</text><rect x="22" y="404" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="404" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="439" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">사람 4</text><text x="42" y="477" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">반복해도 증가가 나타나지 않음</text><text x="24" y="531" font-size="21" fill="#56717d">증폭 결과의 정성 요약 · 실제 검사 곡선 아님</text></g></svg>
