0" text-anchor="start">02</text><text x="42" y="897" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">네 삼각형 면을 접어 정사면체 만들기</text><rect x="22" y="928" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="928" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="963" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">03</text><text x="42" y="1001" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">합쳐지는 꼭짓점마다 O 표시</text><rect x="22" y="1032" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="1032" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="1067" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">04</text><text x="42" y="1105" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">안쪽 빵 끈으로 다른 모형과 연결</text><text x="24" y="1159" font-size="21" fill="#56717d">정사면체 전개도 · 네 면을 접어 테이프로 고정</text></g></svg>
