<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 404" role="img" aria-labelledby="title desc"><title id="title">두 천체의 표면 환경</title><desc id="desc">지구에서 보이는 요소: 구름, 산, 호수, 풀밭 달에서 보이는 요소: 어두운 하늘, 식생이 없는 지표</desc><rect width="600" height="404" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">두 천체의 표면 환경</text><rect x="25" y="75" width="550" height="113" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="108" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">지구에서 보이는 요소</text><text x="44" y="140" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">구름, 산, 호수, 풀밭</text><rect x="25" y="202" width="550" height="113" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="235" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">달에서 보이는 요소</text><text x="44" y="267" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">어두운 하늘, 식생이 없는 지표</text><text x="30" y="349" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">두 천체에서 보이는 요소를 정리한 자료.</text></g></svg>
