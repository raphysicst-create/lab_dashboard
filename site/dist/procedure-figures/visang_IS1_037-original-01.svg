<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1013" role="img"><title>동시 출발을 만드는 위쪽 배치</title><desc>배치 원리 모형 · 사람과 물체의 실제 크기 비례 아님</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="1013" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">동시 출발을 만드는 위쪽 배치</text><rect x="150" y="125" width="460" height="195" rx="0" fill="#e9eff2" stroke="none"/><line x1="150" y1="125" x2="150" y2="320" stroke="#254e64" stroke-width="6"/><line x1="150" y1="320" x2="610" y2="320" stroke="#254e64" stroke-width="6"/><text x="330" y="160" font-size="28" fill="#183a4d" font-weight="400" text-anchor="middle">책상 위</text><rect x="45" y="250" width="490" height="30" rx="0" fill="#f2d9a1" stroke="#9c7c40"/><rect x="55" y="215" width="45" height="35" rx="10" fill="#be8061" stroke="none"/><text x="75" y="205" font-size="27" fill="#183a4d" font-weight="400" text-anchor="middle">A</text><rect x="155" y="285" width="45" height="35" rx="10" fill="#798ec0" stroke="none"/><text x="227" y="308" font-size="27" fill="#183a4d" font-weight="400" text-anchor="middle">B</text><circle cx="300" cy="265" r="13" fill="#d96553" stroke="#286d82" stroke-width="2"/><text x="306" y="232" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">누르는 점</text><line x1="180" y1="325" x2="180" y2="405" stroke="#286d82" stroke-width="4"/><polygon points="180.0,405.0 175.3,393.9 184.7,393.9" fill="#286d82" stroke="#286d82" stroke-width="2"/><text x="213" y="389" font-size="24" fill="#183a4d" font-weight="400" text-anchor="start">B: 수평으로 출발</text><circle cx="75" cy="340" r="18" fill="#fff" stroke="#ae6c51" stroke-width="2"/><line x1="63" y1="328" x2="87" y2="352" stroke="#ae6c51" stroke-width="3"/><line x1="63" y1="352" x2="87" y2="328" stroke="#ae6c51" stroke-width="3"/><text x="28" y="460" font-size="24" fill="#183a4d" font-weight="400" text-anchor="start">A: 아래로 낙하 (화면 안쪽)</text><text x="450" y="424" font-size="24" fill="#183a4d" font-weight="400" text-anchor="start">책상 밖</text><rect x="22" y="495" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="495" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="530" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">01</text><text x="42" y="568" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">A: 책상 밖 자 끝 위</text><rect x="22" y="599" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="599" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="634" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">02</text><text x="42" y="672" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">B: 책상 끝에서 자 옆에 접촉</text><rect x="22" y="703" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="703" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="738" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">03</text><text x="42" y="776" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">자 가운데: 손가락으로 누름</text><rect x="22" y="807" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="807" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="842" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">04</text><text x="42" y="880" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">자 끝을 치면 A 낙하, B 수평 출발</text><text x="24" y="934" font-size="21" fill="#56717d">배치 원리 모형 · 사람과 물체의 실제 크기 비례</text><text x="24" y="966" font-size="21" fill="#56717d">아님</text></g></svg>
