<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 750" role="img"><title>철 솜을 가열했을 때</title><desc>관찰된 질량 변화를 나타낸 모형</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="750" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">철 솜을 가열했을 때</text><text x="25" y="117" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">처음</text><polygon points="300,252 340,252 320,177" fill="#aac3cd" stroke="#286d82" stroke-width="2"/><line x1="140" y1="182" x2="500" y2="182" stroke="#286d82" stroke-width="6"/><line x1="160" y1="182" x2="160" y2="232" stroke="#286d82" stroke-width="3"/><rect x="115" y="232" width="90" height="12" rx="0" fill="#98b9c6" stroke="none"/><path d="M128,225 q12,-20 24,-5 t24,-1 t12,6" stroke="#9ba4aa" stroke-width="12" fill="none"/><line x1="480" y1="182" x2="480" y2="232" stroke="#286d82" stroke-width="3"/><rect x="435" y="232" width="90" height="12" rx="0" fill="#98b9c6" stroke="none"/><path d="M448,225 q12,-20 24,-5 t24,-1 t12,6" stroke="#9ba4aa" stroke-width="12" fill="none"/><rect x="22" y="282" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="282" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="317" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">01</text><text x="42" y="355" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">양쪽 철 솜의 질량이 같아 수평</text><text x="25" y="411" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">오른쪽 가열 후</text><polygon points="300,546 340,546 320,471" fill="#aac3cd" stroke="#286d82" stroke-width="2"/><line x1="140" y1="461" x2="500" y2="491" stroke="#286d82" stroke-width="6"/><line x1="160" y1="461" x2="160" y2="511" stroke="#286d82" stroke-width="3"/><rect x="115" y="511" width="90" height="12" rx="0" fill="#98b9c6" stroke="none"/><path d="M128,504 q12,-20 24,-5 t24,-1 t12,6" stroke="#9ba4aa" stroke-width="12" fill="none"/><line x1="480" y1="491" x2="480" y2="541" stroke="#286d82" stroke-width="3"/><rect x="435" y="541" width="90" height="12" rx="0" fill="#98b9c6" stroke="none"/><path d="M448,534 q12,-20 24,-5 t24,-1 t12,6" stroke="#333c42" stroke-width="12" fill="none"/><rect x="22" y="576" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="576" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="611" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">01</text><text x="42" y="649" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">검게 변한 오른쪽이 아래로 내려감</text><text x="24" y="703" font-size="21" fill="#56717d">관찰된 질량 변화를 나타낸 모형</text></g></svg>
