<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 719" role="img" aria-labelledby="title desc"><title id="title">기온·습도·이슬점의 변화</title><desc id="desc">비교 조건: 맑은 날이며 하루 동안 공기의 수증기량은 거의 유지되는 경우 기온이 높아지는 때: 상대습도는 낮아지는 경향 기온이 낮아지는 때: 상대습도는 높아지는 경향 이슬점: 하루 중 변화가 비교적 작음</desc><rect width="600" height="719" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">기온·습도·이슬점의 변화</text><rect x="25" y="75" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="108" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">비교 조건</text><text x="44" y="140" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">맑은 날이며 하루 동안 공기의 수증기량은</text><text x="44" y="173" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">거의 유지되는 경우</text><rect x="25" y="235" width="550" height="113" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="268" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">기온이 높아지는 때</text><text x="44" y="300" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">상대습도는 낮아지는 경향</text><rect x="25" y="362" width="550" height="113" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="395" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">기온이 낮아지는 때</text><text x="44" y="427" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">상대습도는 높아지는 경향</text><rect x="25" y="489" width="550" height="113" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="522" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">이슬점</text><text x="44" y="554" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">하루 중 변화가 비교적 작음</text><text x="30" y="636" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">실측 시각·값이 없는 정성 자료. 제시된 세 경향의</text><text x="30" y="664" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">관계와 이유를 설명한다.</text></g></svg>
