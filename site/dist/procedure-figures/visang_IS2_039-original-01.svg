<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 611" role="img"><title>세 식당의 평가 정보</title><desc>주어진 응답 수를 항목별로 재정리 · 복수 선택 가능</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="611" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">세 식당의 평가 정보</text><rect x="22" y="92" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">가 · 별점 4.8</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">맛 64 / 양 41 / 청결 37 / 모임 22 / 넓이</text><text x="42" y="200" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">15 / 화장실 9</text><rect x="22" y="231" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="231" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="266" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">나 · 별점 4.6</text><text x="42" y="304" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">맛 3648 / 친절 2701 / 신선 1763 / 청결</text><text x="42" y="339" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">1189 / 메뉴 1054 / 양 832</text><rect x="22" y="370" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="370" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="405" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">다 · 별점 4.2</text><text x="42" y="443" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">맛 973 / 친절 702 / 가격 대비 만족 528 /</text><text x="42" y="478" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">반찬 341 / 청결 157 / 혼밥 125</text><text x="24" y="532" font-size="21" fill="#56717d">주어진 응답 수를 항목별로 재정리 · 복수