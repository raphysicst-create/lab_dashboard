<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" role="img" aria-labelledby="title desc"><title id="title">가열·냉각에서 비교할 온도</title><desc id="desc">물: 가열 중 녹는 구간: 0 ℃ / 냉각 중 어는 구간: 0 ℃ 아세트산: 가열 중 녹는 구간: 16.6 ℃ / 냉각 중 어는 구간: 16.6 ℃</desc><rect width="600" height="470" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">가열·냉각에서 비교할 온도</text><rect x="25" y="75" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="108" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">물</text><text x="44" y="140" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">가열 중 녹는 구간: 0 ℃ / 냉각 중</text><text x="44" y="173" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">어는 구간: 0 ℃</text><rect x="25" y="235" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="268" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">아세트산</text><text x="44" y="300" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">가열 중 녹는 구간: 16.6 ℃ / 냉각</text><text x="44" y="333" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">중 어는 구간: 16.6 ℃</text><text x="30" y="415" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">상태 변화 온도만 정리한 표</text></g></svg>
