<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 813" role="img" aria-labelledby="title desc"><title id="title">암석의 변화 경로</title><desc id="desc">마그마 → 화성암: 냉각되어 굳음 암석 → 퇴적물: 풍화·침식·운반 퇴적물 → 퇴적암: 퇴적물이 굳음 암석 → 변성암: 높은 열과 압력 암석 → 마그마: 녹음</desc><rect width="600" height="813" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">암석의 변화 경로</text><rect x="25" y="75" width="550" height="113" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="108" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">마그마 → 화성암</text><text x="44" y="140" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">냉각되어 굳음</text><rect x="25" y="202" width="550" height="113" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="235" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">암석 → 퇴적물</text><text x="44" y="267" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">풍화·침식·운반</text><rect x="25" y="329" width="550" height="113" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="362" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">퇴적물 → 퇴적암</text><text x="44" y="394" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">퇴적물이 굳음</text><rect x="25" y="456" width="550" height="113" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="489" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">암석 → 변성암</text><text x="44" y="521" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">높은 열과 압력</text><rect x="25" y="583" width="550" height="113" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="616" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">암석 → 마그마</text><text x="44" y="648" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">녹음</text><text x="30" y="730" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">암석 변화 경로표. 해당 경로를 설명하며 말을 상태</text><text x="30" y="758" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">사이에서 옮긴다.</text></g></svg>
