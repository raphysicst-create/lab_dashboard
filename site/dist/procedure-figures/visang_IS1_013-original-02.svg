<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 541" role="img"><title>배열한 사건에 설명 붙이기</title><desc>완성 그림을 뒤집는 방식 대신 사건–설명 연결 활동</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="541" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">배열한 사건에 설명 붙이기</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">01</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">원소가 언제 만들어졌는가?</text><rect x="22" y="196" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">02</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">먼저 생긴 물질이 다음 사건의 재료가</text><text x="42" y="304" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">되는가?</text><rect x="22" y="335" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="335" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="370" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">03</text><text x="42" y="408" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">우주와 지구의 역사는 어떻게 이어지는가?</text><text x="24" y="462" font-size="21" fill="#56717d">완성 그림을 뒤집는 방식 대신 사건–설명 연결</text><text x="24" y="494" font-size="21" fill="#56717d">활동</text></g></svg>
