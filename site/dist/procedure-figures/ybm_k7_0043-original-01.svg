<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" role="img" aria-labelledby="title desc"><title id="title">고무줄 배의 부품 배치</title><desc id="desc">병 양옆의 긴 막대가 뒤로 뻗고 그 사이 고무줄에 두 플라스틱 조각의 노를 끼운다. 풀릴 때 노가 물을 뒤로 밀도록 감는다.</desc><rect width="600" height="680" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">고무줄 배의 부품 배치</text><rect x="170" y="145" width="260" height="290" rx="45" fill="#eef4f5" stroke="#63808c"/><rect x="242" y="100" width="116" height="54" rx="8" fill="#8bb5c1" stroke="none"/><text x="300" y="81" font-size="23" fill="#21394a" text-anchor="middle" font-weight="normal">앞: 병뚜껑</text><line x1="140" y1="175" x2="140" y2="530" stroke="#aa815b" stroke-width="12"/><line x1="460" y1="175" x2="460" y2="530" stroke="#aa815b" stroke-width="12"/><line x1="140" y1="490" x2="460" y2="490" stroke="#c69936" stroke-width="5"/><rect x="252" y="462" width="96" height="58" rx="4" fill="#a9cdd9" stroke="#477b8d"/><text x="300" y="571" font-size="24" fill="#21394a" text-anchor="middle" font-weight="normal">뒤: 고무줄과 노</text><text x="300" y="617" font-size="21" fill="#21394a" text-anchor="middle" font-weight="normal">노를 돌려 고무줄을 감고 놓는다.</text><text x="300" y="651" font-size="21" fill="#21394a" text-anchor="middle" font-weight="normal">놓였을 때 노가 물을 뒤로 밀도록 감는다.</text></g></svg>
