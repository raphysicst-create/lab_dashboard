<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 821" role="img"><title>시간축에 놓을 출현 시점</title><desc>사실 관계를 정리한 학습 자료</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="821" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">시간축에 놓을 출현 시점</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">지구 탄생</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">약 45.67억 년 전</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">광합성 생물</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">약 35억 년 전</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">육상식물</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">약 4.2억 년 전</text><rect x="22" y="404" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="404" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="439" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">육상 척추동물</text><text x="42" y="477" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">약 3.8억 년 전</text><rect x="22" y="508" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="508" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="543" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">유인원 계통의 화석</text><text x="42" y="581" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">약 2520만 년 전 · 최초 출현 확정값 아님</text><rect x="22" y="612" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="612" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="647" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">시대 경계</text><text x="42" y="685" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">고생대 5.39억 / 중생대 2.52억 / 신생대</text><text x="42" y="720" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">0.66억 년 전</text><text x="24" y="774" font-size="21" fill="#56717d">사실 관계를 정리한 학습 자료</text></g></svg>
