<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 786" role="img"><title>대기 관측에 쓰이는 양과 단위</title><desc>단위 분류를 위한 항목별 관측 정보</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="786" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">대기 관측에 쓰이는 양과 단위</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">시각</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">9시 · 10시 · 11시 · 3시 · 4시</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">농도</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">미세먼지·초미세먼지: μg/m³</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">기온</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">℃</text><rect x="22" y="404" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="404" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="439" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">습도</text><text x="42" y="477" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">%</text><rect x="22" y="508" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="508" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="543" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">풍속</text><text x="42" y="581" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">m/s</text><rect x="22" y="612" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="612" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="647" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">관찰 기록</text><text x="42" y="685" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">11시 환기 1회</text><text x="24" y="739" font-size="21" fill="#56717d">단위 분류를 위한 항목별 관측 정보</text></g></svg>
