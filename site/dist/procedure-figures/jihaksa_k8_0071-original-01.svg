<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" role="img" aria-labelledby="title desc"><title id="title">막대자석 바깥의 자기장</title><desc id="desc">자석 바깥에서 N극을 나와 S극으로 향하는 자기장을 독립 곡선으로 나타냈다. 철가루 사진이나 실제 관측 분포가 아니다.</desc><rect width="600" height="650" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">막대자석 바깥의 자기장</text><rect x="150" y="270" width="150" height="65" rx="0" fill="#c45d61" stroke="none"/><rect x="300" y="270" width="150" height="65" rx="0" fill="#5e82ab" stroke="none"/><text x="225" y="314" font-size="29" fill="#fff" text-anchor="middle" font-weight="normal">N</text><text x="375" y="314" font-size="29" fill="#fff" text-anchor="middle" font-weight="normal">S</text><path d="M 150 300 C 90 180, 510 180, 450 300" fill="none" stroke="#416b7d" stroke-width="3"/><path d="M 150 305 C 90 425, 510 425, 450 305" fill="none" stroke="#416b7d" stroke-width="3"/><line x1="282" y1="210.0" x2="320" y2="210.0" stroke="#1c7a88" stroke-width="3"/><polygon points="320.0,210.0 310.1,214.8 310.1,205.2" fill="#1c7a88"/><path d="M 150 300 C 40 80, 560 80, 450 300" fill="none" stroke="#416b7d" stroke-width="3"/><path d="M 150 305 C 40 525, 560 525, 450 305" fill="none" stroke="#416b7d" stroke-width="3"/><line x1="282" y1="135.0" x2="320" y2="135.0" stroke="#1c7a88" stroke-width="3"/><polygon points="320.0,135.0 310.1,139.8 310.1,130.2" fill="#1c7a88"/><path d="M 150 300 C -10 -20, 610 -20, 450 300" fill="none" stroke="#416b7d" stroke-width="3"/><path d="M 150 305 C -10 625, 610 625, 450 305" fill="none" stroke="#416b7d" stroke-width="3"/><line x1="282" y1="60.0" x2="320" y2="60.0" stroke="#1c7a88" stroke-width="3"/><polygon points="320.0,60.0 310.1,64.8 310.1,55.2" fill="#1c7a88"/><text x="300" y="585" font-size="21" fill="#21394a" text-anchor="middle" font-weight="normal">곡선은 자기장의 방향을 나타내는 개념선</text><text x="300" y="619" font-size="21" fill="#21394a" text-anchor="middle" font-weight="normal">나침반 N극의 실제 방향을 관찰해 비교</text></g></svg>
