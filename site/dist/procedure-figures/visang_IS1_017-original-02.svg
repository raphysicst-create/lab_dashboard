<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1026" role="img"><title>시간 순서로 놓을 사건</title><desc>새로 배열한 사건 카드 · 사건의 사실 관계로 순서를 결정</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="1026" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">시간 순서로 놓을 사건</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">01</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">초신성 폭발</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">02</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">원자 생성</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">03</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">미행성체 충돌</text><rect x="22" y="404" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="404" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="439" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">04</text><text x="42" y="477" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">빅뱅</text><rect x="22" y="508" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="508" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="543" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">05</text><text x="42" y="581" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">원시 바다에서 생명체 탄생</text><rect x="22" y="612" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="612" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="647" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">06</text><text x="42" y="685" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">별의 진화</text><rect x="22" y="716" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="716" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="751" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">07</text><text x="42" y="789" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">원시 태양 생성</text><rect x="22" y="820" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="820" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="855" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">08</text><text x="42" y="893" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">태양계 성운 수축</text><text x="24" y="947" font-size="21" fill="#56717d">새로 배열한 사건 카드 · 사건의 사실 관계로</text><text x="24" y="979" font-size="21" fill="#56717d">순서를 결정</text></g></svg>
