<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img"><title>두 대상의 질량 구성</title><desc>사실 관계를 정리한 학습 자료</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="440" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">두 대상의 질량 구성</text><rect x="22" y="92" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">사람</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">산소 65% · 탄소 18.5% · 수소 9.5% · 질소</text><text x="42" y="200" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">3.3% · 칼슘 1.5% · 인 1.0% · 기타 1.2%</text><rect x="22" y="231" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="231" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="266" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">지구</text><text x="42" y="304" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">철 35% · 산소 30% · 규소 15% · 마그네슘</text><text x="42" y="339" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">13% · 니켈 2.4% · 기타 4.6%</text><text x="24" y="393" font-size="21" fill="#56717d">사실 관계를 정리한 학습 자료</text></g></svg>
