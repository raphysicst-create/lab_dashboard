<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 537" role="img"><title>구리판 표면의 관찰 기록</title><desc>관찰된 색 변화를 나타낸 개념도</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="537" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">구리판 표면의 관찰 기록</text><text x="28" y="117" font-size="28" fill="#183a4d" font-weight="700" text-anchor="start">가열 전</text><rect x="405" y="102" width="160" height="60" rx="0" fill="#b86c48" stroke="none"/><text x="28" y="177" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">붉은 갈색</text><text x="28" y="242" font-size="28" fill="#183a4d" font-weight="700" text-anchor="start">겉불꽃에 가열</text><rect x="405" y="227" width="160" height="60" rx="0" fill="#34363a" stroke="none"/><text x="28" y="302" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">표면이 검게 변함</text><text x="28" y="367" font-size="28" fill="#183a4d" font-weight="700" text-anchor="start">속불꽃에 다시 가열</text><rect x="405" y="352" width="160" height="60" rx="0" fill="#b86c48" stroke="none"/><text x="28" y="427" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">붉은 갈색 표면이 나타남</text><text x="24" y="490" font-size="21" fill="#56717d">관찰된 색 변화를 나타낸 개념도</text></g></svg>
