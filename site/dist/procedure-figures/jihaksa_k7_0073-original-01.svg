<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 630" role="img" aria-labelledby="title desc"><title id="title">태양 관측 기록 안내</title><desc id="desc">관측 영상 선택: 우주환경센터에서 같은 관측 방식의 서로 다른 시각 영상을 찾는다. 각 영상에 남길 정보: 촬영 시각, 밝은 영역과 어두운 영역, 표면·대기 현상 여부를 기록한다. 비교할 항목: 같은 영역의 밝기와 무늬가 시점에 따라 달라지는지 비교한다.</desc><rect width="600" height="630" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">태양 관측 기록 안내</text><rect x="25" y="75" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="108" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">관측 영상 선택</text><text x="44" y="140" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">우주환경센터에서 같은 관측 방식의 서로 다른</text><text x="44" y="173" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">시각 영상을 찾는다.</text><rect x="25" y="235" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="268" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">각 영상에 남길 정보</text><text x="44" y="300" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">촬영 시각, 밝은 영역과 어두운 영역,</text><text x="44" y="333" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">표면·대기 현상 여부를 기록한다.</text><rect x="25" y="395" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="428" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">비교할 항목</text><text x="44" y="460" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">같은 영역의 밝기와 무늬가 시점에 따라</text><text x="44" y="493" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">달라지는지 비교한다.</text><text x="30" y="575" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">관측 사진이 아닌 조사 안내 도식</text></g></svg>
