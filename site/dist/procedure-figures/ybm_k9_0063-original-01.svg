<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" role="img" aria-labelledby="title desc"><title id="title">자극에서 반응까지의 연결 틀</title><desc id="desc">감각기관에서 감각뉴런, 중추, 운동뉴런, 운동기관으로 이어지는 기본 틀. 특정 반사의 중추와 의식적 반응의 경로는 사례에 맞게 학습자가 완성한다.</desc><rect width="600" height="620" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">자극에서 반응까지의 연결 틀</text><rect x="165" y="90" width="270" height="58" rx="12" fill="#eaf2f4" stroke="none"/><text x="300" y="129" font-size="25" fill="#21394a" text-anchor="middle" font-weight="normal">감각기관</text><line x1="300" y1="149" x2="300" y2="174" stroke="#1c7a88" stroke-width="3"/><polygon points="300.0,174.0 295.2,164.1 304.8,164.1" fill="#1c7a88"/><rect x="165" y="175" width="270" height="58" rx="12" fill="#eaf2f4" stroke="none"/><text x="300" y="214" font-size="25" fill="#21394a" text-anchor="middle" font-weight="normal">감각뉴런</text><line x1="300" y1="234" x2="300" y2="259" stroke="#1c7a88" stroke-width="3"/><polygon points="300.0,259.0 295.2,249.1 304.8,249.1" fill="#1c7a88"/><rect x="165" y="260" width="270" height="58" rx="12" fill="#eaf2f4" stroke="none"/><text x="300" y="299" font-size="25" fill="#21394a" text-anchor="middle" font-weight="normal">척수 또는 뇌</text><line x1="300" y1="319" x2="300" y2="344" stroke="#1c7a88" stroke-width="3"/><polygon points="300.0,344.0 295.2,334.1 304.8,334.1" fill="#1c7a88"/><rect x="165" y="345" width="270" height="58" rx="12" fill="#eaf2f4" stroke="none"/><text x="300" y="384" font-size="25" fill="#21394a" text-anchor="middle" font-weight="normal">운동뉴런</text><line x1="300" y1="404" x2="300" y2="429" stroke="#1c7a88" stroke-width="3"/><polygon points="300.0,429.0 295.2,419.1 304.8,419.1" fill="#1c7a88"/><rect x="165" y="430" width="270" height="58" rx="12" fill="#eaf2f4" stroke="none"/><text x="300" y="469" font-size="25" fill="#21394a" text-anchor="middle" font-weight="normal">운동기관</text><text x="300" y="545" font-size="22" fill="#21394a" text-anchor="middle" font-weight="normal">무조건반사와 의식적 반응의 예를 골라</text><text x="300" y="582" font-size="22" fill="#21394a" text-anchor="middle" font-weight="normal">중추의 위치와 연결 경로를 따로 완성한다.</text></g></svg>
