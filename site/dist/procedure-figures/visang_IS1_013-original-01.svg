<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 786" role="img"><title>우주 이야기 순서 맞추기</title><desc>새로 구성한 사건 조각 · 잘라서 시간 순서로 배열</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="786" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">우주 이야기 순서 맞추기</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">01</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">별의 탄생</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">02</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">우주의 시작</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">03</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">태양계 형성</text><rect x="22" y="404" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="404" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="439" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">04</text><text x="42" y="477" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">원자 형성</text><rect x="22" y="508" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="508" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="543" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">05</text><text x="42" y="581" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">생명체의 등장</text><rect x="22" y="612" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="612" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="647" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">06</text><text x="42" y="685" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">별 내부의 원소 생성</text><text x="24" y="739" font-size="21" fill="#56717d">새로 구성한 사건 조각 · 잘라서 시간 순서로 배열</text></g></svg>
