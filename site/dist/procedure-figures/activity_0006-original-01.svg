<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1121" role="img"><title>분류 카드 A–I</title><style>text{font-family:Arial,"Malgun Gothic",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style><rect width="640" height="1121" fill="white"/><text x="26" y="40" font-size="27" fill="#24364b" text-anchor="start" font-weight="bold">분류 카드 A–I</text><line x1="26" y1="56" x2="614" y2="56" stroke="#dce5ee" stroke-width="2"/><rect x="26" y="75" width="150" height="54" rx="0" fill="#e6f0f8" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="110" font-size="23" fill="#24364b" text-anchor="start" font-weight="bold">카드</text><rect x="176" y="75" width="438" height="54" rx="0" fill="#e6f0f8" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="110" font-size="23" fill="#24364b" text-anchor="start" font-weight="bold">비교에 사용할 사실</text><rect x="26" y="129" width="150" height="115" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="159" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">A · 흰</text><text x="38" y="190" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">가루</text><rect x="176" y="129" width="438" height="115" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="159" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">50 g과 100 g을 각각</text><text x="188" y="190" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">가열하면 녹는 온도는 모두 185</text><text x="188" y="221" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">℃이다.</text><rect x="26" y="244" width="150" height="115" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="274" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">B · 투명</text><text x="38" y="305" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">고체</text><rect x="176" y="244" width="438" height="115" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="274" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">20 g과 50 g의 가열</text><text x="188" y="305" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">곡선에서 녹는 동안의 온도는 모두</text><text x="188" y="336" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">0 ℃이다.</text><rect x="26" y="359" width="150" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="389" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">C · 투명</text><text x="38" y="420" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">액체</text><rect x="176" y="359" width="438" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="389" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">냉각 중 얼기 시작한 이후에도</text><text x="188" y="420" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">온도가 계속 내려간다.</text><rect x="26" y="443" width="150" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="473" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">D · 투명</text><text x="38" y="504" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">액체</text><rect x="176" y="443" width="438" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="473" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">10 mL와 45 mL의 끓는점은</text><text x="188" y="504" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">모두 78.5 ℃이다.</text><rect x="26" y="527" width="150" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="557" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">E · 투명</text><text x="38" y="588" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">액체</text><rect x="176" y="527" width="438" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="557" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">페트병 뚜껑을 열면 기포가 많이</text><text x="188" y="588" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">생긴다.</text><rect x="26" y="611" width="150" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="641" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">F · 투명</text><text x="38" y="672" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">액체</text><rect x="176" y="611" width="438" height="84" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="641" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">78.5 ℃에서 끓기 시작한</text><text x="188" y="672" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">뒤에도 온도가 계속 올라간다.</text><rect x="26" y="695" width="150" height="115" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="725" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">G · 주황</text><text x="38" y="756" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">액체</text><rect x="176" y="695" width="438" height="115" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="725" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">위층 20 mL는 25 g,</text><text x="188" y="756" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">건더기가 내려앉은 아래층 20</text><text x="188" y="787" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">mL는 28 g이다.</text><rect x="26" y="810" width="150" height="115" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="840" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">H · 흰</text><text x="38" y="871" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">가루</text><rect x="176" y="810" width="438" height="115" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="840" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">16.4 g의 부피는 10 mL,</text><text x="188" y="871" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">32.8 g의 부피는 20</text><text x="188" y="902" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">mL이다.</text><rect x="26" y="925" width="150" height="146" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="38" y="955" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">I · 흰</text><text x="38" y="986" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">가루</text><rect x="176" y="925" width="438" height="146" rx="0" fill="white" stroke="#b7c7d8" stroke-width="2"/><text x="188" y="955" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">물 50 g에 최대로 18 g이</text><text x="188" y="986" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">녹는다. 물 100 g에 80</text><text x="188" y="1017" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">g을 넣으면 44 g이 녹지</text><text x="188" y="1048" font-size="22" fill="#24364b" text-anchor="start" font-weight="normal">않는다.</text><text x="26" y="1105" font-size="14" fill="#64748b" text-anchor="start" font-weight="normal">직접 구성한 비교표 · 제시된 조건을 읽고 판단하기</text></svg>