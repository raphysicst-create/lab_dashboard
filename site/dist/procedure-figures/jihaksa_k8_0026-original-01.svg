<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 980" role="img" aria-labelledby="title desc"><title id="title">반원형 물통의 두 배치</title><desc id="desc">공기에서 물로 진행할 때와 물에서 공기로 진행할 때의 독립 배치도. 곧은 면의 중점에 빛을 비추며 법선 기준 각도를 사용한다. 굴절 경로는 측정할 대상이므로 표시하지 않았다.</desc><rect width="600" height="980" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">반원형 물통의 두 배치</text><text x="28" y="95" font-size="25" fill="#21394a" text-anchor="start" font-weight="bold">공기 → 물</text><path d="M 120 270 A 180 180 0 0 0 480 270 Z" fill="#d9edf4" stroke="#5e9cae" stroke-width="3"/><line x1="300" y1="120" x2="300" y2="415" stroke="#8296a4" stroke-width="3" stroke-dasharray="8 6"/><text x="460" y="325" font-size="24" fill="#21394a" text-anchor="start" font-weight="normal">물</text><text x="460" y="200" font-size="24" fill="#21394a" text-anchor="start" font-weight="normal">공기</text><line x1="217.5" y1="127.10580837556762" x2="300" y2="270" stroke="#c87336" stroke-width="3"/><polygon points="300.0,270.0 290.9,263.8 299.2,259.0" fill="#c87336"/><text x="197.5" y="117.10580837556762" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">30°</text><line x1="183.32738110421965" y1="153.32738110421965" x2="300" y2="270" stroke="#9868a0" stroke-width="3"/><polygon points="300.0,270.0 289.6,266.4 296.4,259.6" fill="#9868a0"/><text x="163.32738110421965" y="143.32738110421965" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">45°</text><circle cx="300" cy="270" r="5" fill="#21394a" stroke="none" stroke-width="3"/><text x="28" y="535" font-size="25" fill="#21394a" text-anchor="start" font-weight="bold">물 → 공기</text><path d="M 120 710 A 180 180 0 0 1 480 710 Z" fill="#d9edf4" stroke="#5e9cae" stroke-width="3"/><line x1="300" y1="560" x2="300" y2="855" stroke="#8296a4" stroke-width="3" stroke-dasharray="8 6"/><text x="460" y="660" font-size="24" fill="#21394a" text-anchor="start" font-weight="normal">물</text><text x="460" y="780" font-size="24" fill="#21394a" text-anchor="start" font-weight="normal">공기</text><line x1="217.5" y1="567.1058083755677" x2="300" y2="710" stroke="#c87336" stroke-width="3"/><polygon points="300.0,710.0 290.9,703.8 299.2,699.0" fill="#c87336"/><text x="197.5" y="557.1058083755677" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">30°</text><circle cx="300" cy="710" r="5" fill="#21394a" stroke="none" stroke-width="3"/><text x="30" y="910" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">곧은 면의 중점 = 각도판 중심</text><text x="30" y="950" font-size="21" fill="#21394a" text-anchor="start" font-weight="normal">물에 우유 두세 방울 · 레이저 눈 노출 금지</text></g></svg>
