<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 498" role="img" aria-labelledby="title desc"><title id="title">냉장고의 에너지 표시 비교</title><desc id="desc">냉장고 A · 1등급: 월간 43.0 kWh / 시간당 CO₂ 25 g / 연간 예상 전기 요금 83,000원 냉장고 B · 2등급: 월간 46.7 kWh / 시간당 CO₂ 27 g / 연간 예상 전기 요금 90,000원</desc><rect width="600" height="498" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">냉장고의 에너지 표시 비교</text><rect x="25" y="75" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="108" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">냉장고 A · 1등급</text><text x="44" y="140" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">월간 43.0 kWh / 시간당 CO₂ 25</text><text x="44" y="173" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">g / 연간 예상 전기 요금 83,000원</text><rect x="25" y="235" width="550" height="146" rx="12" fill="#eaf2f4" stroke="none"/><text x="44" y="268" font-size="24" fill="#21394a" text-anchor="start" font-weight="bold">냉장고 B · 2등급</text><text x="44" y="300" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">월간 46.7 kWh / 시간당 CO₂ 27</text><text x="44" y="333" font-size="23" fill="#21394a" text-anchor="start" font-weight="normal">g / 연간 예상 전기 요금 90,000원</text><text x="30" y="415" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">비교 활동에 제공된 표시값. 현재 판매 제품이나 현행</text><text x="30" y="443" font-size="19" fill="#21394a" text-anchor="start" font-weight="normal">요금 안내가 아니다.</text></g></svg>
