<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 717" role="img"><title>측정 프로그램의 논리</title><desc>블록 화면 대신 직접 설계한 동작 흐름</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="717" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">측정 프로그램의 논리</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">A 버튼</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">기록 시작</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">B 버튼</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">기록 중지</text><rect x="22" y="300" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">A+B 버튼</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">저장 기록 초기화</text><rect x="22" y="404" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="404" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="439" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">측정 반복</text><text x="42" y="477" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">LED 제어 → 아날로그 읽기 → 농도 변환 →</text><text x="42" y="512" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">저장</text><rect x="22" y="543" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="543" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="578" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">예시 간격</text><text x="42" y="616" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">300,000 ms = 5분 / 실제 연결 핀 선택</text><text x="24" y="670" font-size="21" fill="#56717d">블록 화면 대신 직접 설계한 동작 흐름</text></g></svg>
