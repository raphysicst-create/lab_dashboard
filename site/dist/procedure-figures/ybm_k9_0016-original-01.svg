<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" role="img" aria-labelledby="title desc"><title id="title">복사 평형을 생각하는 변화 모형</title><desc id="desc">처음 상승하다가 일정한 수준에 가까워지는 온도 경향을 새 곡선으로 표현했다. 원본 관측점·눈금·실측 곡선의 재현이 아니다.</desc><rect width="600" height="620" fill="#fff"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="28" y="44" font-size="28" fill="#21394a" text-anchor="start" font-weight="bold">복사 평형을 생각하는 변화 모형</text><line x1="90" y1="400" x2="550" y2="400" stroke="#1c7a88" stroke-width="3"/><polygon points="550.0,400.0 540.1,404.8 540.1,395.2" fill="#1c7a88"/><line x1="90" y1="400" x2="90" y2="100" stroke="#1c7a88" stroke-width="3"/><polygon points="90.0,100.0 94.8,109.9 85.2,109.9" fill="#1c7a88"/><text x="320" y="448" font-size="23" fill="#21394a" text-anchor="middle" font-weight="normal">시간 경과</text><text x="45" y="250" font-size="22" fill="#21394a" text-anchor="start" font-weight="normal">온도</text><path d="M 96 365 C 170 230, 240 177, 345 165 C 415 162, 480 162, 540 162" fill="none" stroke="#cb753e" stroke-width="5"/><text x="300" y="510" font-size="22" fill="#21394a" text-anchor="middle" font-weight="normal">처음 상승 → 변화가 작아지는 구간</text><text x="300" y="550" font-size="22" fill="#21394a" text-anchor="middle" font-weight="normal">적외선등: 태양 / 검은 컵: 지구</text><text x="300" y="590" font-size="20" fill="#21394a" text-anchor="middle" font-weight="normal">정성적 변화 모형 · 실측 시간·온도 없음</text></g></svg>
