<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 821" role="img"><title>해양 생태계 구성 카드</title><desc>구성원 분류 자료</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="821" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">해양 생태계 구성 카드</text><rect x="22" y="92" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">01</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">다시마 · 식물 플랑크톤</text><rect x="22" y="196" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="196" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="231" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">02</text><text x="42" y="269" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">동물 플랑크톤 · 성게 · 해삼 · 갑각류</text><rect x="22" y="300" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="300" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="335" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">03</text><text x="42" y="373" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">작은 바닥 동물을 먹는 어류 · 플랑크톤을</text><text x="42" y="408" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">먹는 어류 · 육식성 어류</text><rect x="22" y="439" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="439" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="474" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">04</text><text x="42" y="512" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">해달 · 고래 · 바닷새</text><rect x="22" y="543" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="543" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="578" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">05</text><text x="42" y="616" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">세균</text><rect x="22" y="647" width="596" height="90" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="647" width="6" height="90" rx="0" fill="#26748a" stroke="none"/><text x="42" y="682" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">06</text><text x="42" y="720" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">비생물 요소: 빛 · 바닷물</text><text x="24" y="774" font-size="21" fill="#56717d">구성원 분류 자료</text></g></svg>
