<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 472" role="img"><title>2100년을 향한 두 경로</title><desc>시나리오의 추세 비교 · 실제 미래를 단정하는 자료 아님</desc><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect width="640" height="472" fill="#ffffff"/><rect x="0" y="0" width="640" height="76" fill="#173b4d"/><text x="24" y="48" fill="#ffffff" font-size="28" font-weight="700">2100년을 향한 두 경로</text><rect x="22" y="92" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="92" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="127" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">A · 감축하지 않는 경로</text><text x="42" y="165" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">화석 연료 사용 지속 / 배출량 크게 증가 /</text><text x="42" y="200" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">기온 상승 폭 큼</text><rect x="22" y="231" width="596" height="125" rx="10" fill="#edf5f6" stroke="none"/><rect x="22" y="231" width="6" height="125" rx="0" fill="#26748a" stroke="none"/><text x="42" y="266" font-size="27" fill="#183a4d" font-weight="700" text-anchor="start">B · 감축에 성공하는 경로</text><text x="42" y="304" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">온실 기체 배출량 감소 / 기온 상승 폭이</text><text x="42" y="339" font-size="25" fill="#183a4d" font-weight="400" text-anchor="start">상대적으로 작음</text><text x="24" y="393" font-size="21" fill="#56717d">시나리오의 추세 비교 · 실제 미래를 단정하는 자료</text><text x="24" y="425" font-size="21" fill="#56717d">아님</text></g></svg>
