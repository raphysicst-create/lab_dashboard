<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img"><title>온도가 변할 때 두 용질의 용해도 경향</title><style>text{font-family:Arial,"Malgun Gothic",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style><rect width="640" height="600" fill="white"/><text x="26" y="40" font-size="27" fill="#24364b" text-anchor="start" font-weight="bold">온도가 변할 때 두 용질의 용해도 경향</text><line x1="26" y1="56" x2="614" y2="56" stroke="#dce5ee" stroke-width="2"/><line x1="82" y1="395" x2="594" y2="395" stroke="#64748b" stroke-width="2"/><path d="M 582.9472680719654 399.6730201077038 L 594 395 L 582.9472680719654 390.3269798922962" fill="none" stroke="#64748b" stroke-width="2"/><line x1="82" y1="395" x2="82" y2="105" stroke="#64748b" stroke-width="2"/><path d="M 86.6730201077038 116.05273192803462 L 82 105 L 77.3269798922962 116.05273192803462" fill="none" stroke="#64748b" stroke-width="2"/><text x="338" y="449" font-size="24" fill="#24364b" text-anchor="middle" font-weight="normal">온도 증가 →</text><text x="36" y="86" font-size="23" fill="#24364b" text-anchor="start" font-weight="normal">용해도</text><text x="95" y="115" font-size="20" fill="#64748b" text-anchor="start" font-weight="normal">물 100 g에 녹는 질량</text><path d="M 98 360 C 220 325 330 250 424 118" fill="none" stroke="#2563a6" stroke-width="5"/><path d="M 98 301 C 270 298 430 293 580 288" fill="none" stroke="#11756c" stroke-width="5"/><text x="402" y="180" font-size="23" fill="#2563a6" text-anchor="start" font-weight="normal">질산 칼륨</text><text x="395" y="333" font-size="23" fill="#11756c" text-anchor="start" font-weight="normal">염화 나트륨</text><text x="110" y="490" font-size="21" fill="#24364b" text-anchor="start" font-weight="normal">기울기와 상대적인 변화량을 비교한다. 정확한</text><text x="110" y="521" font-size="21" fill="#24364b" text-anchor="start" font-weight="normal">용해도 값은 이 개념도에서 읽지 않는다.</text><text x="26" y="584" font-size="14" fill="#64748b" text-anchor="start" font-weight="normal">정량 측정 그래프가 아닌 경향 모형</text></svg>